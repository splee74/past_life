<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전생 감정소</title>
<meta name="description" content="이름과 생년월일로 당신의 전생을 감정해 드립니다. 전생에서 했던 실수까지!">
<meta property="og:type" content="website">
<meta property="og:title" content="전생 감정소 — 나의 전생은?">
<meta property="og:description" content="이름과 생년월일로 당신의 전생을 감정해 드립니다. 전생에서 했던 실수까지!">
<meta property="og:url" content="https://pastlife-alpha.vercel.app/">
<meta property="og:image" content="https://pastlife-alpha.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#b8322a">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="전생감정소">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 장의 한지 '전생 감정서' — 접수창 → 감정서 카드 이미지 → 다른 사람들의 감정서 게시판 */
:root{
  --paper:#f3ecdf; --sheet:#fbf7ef; --ink:#2b2622; --ink-soft:#6f655b;
  --line:#d9cdb8; --seal:#b8322a; --seal-soft:#f1d9d3; --gold:#9a7424;
  --rare:#2f6b8a; --legend:#8a3d8f; --kakao:#fee500; --kakao-ink:#191600;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1814; --sheet:#25211c; --ink:#efe7da; --ink-soft:#b3a796;
  --line:#3d362e; --seal:#e0594e; --seal-soft:#3a2320; --gold:#d4ad5c;
  --rare:#73b4d4; --legend:#cf8ad3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1814; --sheet:#25211c; --ink:#efe7da; --ink-soft:#b3a796;
  --line:#3d362e; --seal:#e0594e; --seal-soft:#3a2320; --gold:#d4ad5c;
  --rare:#73b4d4; --legend:#cf8ad3; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:520px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--seal);font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.snd{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;padding:3px 10px;border-radius:999px}
.snd:hover{border-color:var(--ink-soft)}
h1{font-family:var(--display);font-size:34px;margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--ink-soft);margin:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:500}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:11px 12px;min-width:0;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:4px}
button:disabled{opacity:.5;cursor:default}
.go{background:var(--seal);color:#fff;border:0;padding:13px;font-size:16px;font-weight:600;letter-spacing:.04em}
.go:hover{filter:brightness(1.08)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:11px}
.ghost:hover{border-color:var(--ink-soft)}
.kakao{background:var(--kakao);color:var(--kakao-ink);border:0;padding:12px;font-weight:600}
.err{color:var(--seal);font-size:13px;margin:0}
.toast{font-size:13px;color:var(--gold);margin:0;min-height:1.2em;text-align:center}

.result{display:flex;flex-direction:column;gap:12px}
.reveal-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px 2px}
.reveal-head .pre{font-size:14px;color:var(--ink-soft);margin:0}
.reveal-head .title{font-family:var(--display);font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.badge{font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;color:#fff;letter-spacing:.08em}
.b-1{background:var(--ink-soft)} .b-2{background:var(--rare)} .b-3{background:linear-gradient(90deg,var(--legend),var(--gold))}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.loader{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--paper) 94%,transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.orb{width:120px;height:120px;border-radius:50%;border:3px solid var(--seal);display:grid;place-items:center;
  font-family:var(--display);font-size:34px;font-weight:700;color:var(--seal);position:relative}
.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px dashed var(--gold);animation:spin 2.4s linear infinite}
.orb span{animation:flick 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{50%{opacity:.35}}
.lstep{font-family:var(--display);font-size:19px;margin:0;text-align:center;min-height:1.6em}
.bar{width:min(240px,70vw);height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--seal);transition:width 2.2s linear}
@media (prefers-reduced-motion:reduce){.orb::after,.orb span,.pop{animation:none}.bar i{transition:none}}
.cardimg{width:100%;max-width:100%;aspect-ratio:4/5;border-radius:6px;border:1px solid var(--line);display:block;background:var(--sheet)}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .wide{grid-column:1/-1}

.mistake{border:1px dashed var(--seal);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--seal-soft) 35%,var(--sheet));position:relative;overflow:hidden}
.mistake .label{font-size:12px;letter-spacing:.12em;color:var(--seal);font-weight:600}
.mistake p{margin:0}
.mistake .big{font-family:var(--display);font-size:18px;font-weight:700}
.reveal{background:var(--ink);color:var(--paper);border:0;padding:11px;font-weight:600}
.caught{position:absolute;top:10px;right:12px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-weight:700;
  font-size:15px;padding:2px 10px;border-radius:4px;transform:rotate(-10deg);animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{from{transform:rotate(-10deg) scale(2.6);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.shaking{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-2px,1px) rotate(-.6deg)}75%{transform:translate(2px,-1px) rotate(.6deg)}}
.burst::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--gold) 0%,transparent 70%);animation:flash .8s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(2.2)}}
.fadein{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.shaking,.burst::after,.caught,.fadein{animation:none}}

.feed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.post{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.post-top{display:flex;gap:12px;align-items:center}
.pglyph{font-size:30px;width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.pmeta{min-width:0;display:flex;flex-direction:column}
.pname{font-size:13px;color:var(--ink-soft)}
.plife{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.3}
.rarity{align-self:flex-start;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.06em}
.r-1{color:var(--ink-soft)} .r-2{color:var(--rare)} .r-3{color:var(--legend)}
.pmistake{font-size:13px;color:var(--ink-soft);margin:0}
.ctoggle{align-self:flex-start;background:none;border:0;color:var(--seal);padding:4px 0;font-size:13px;font-weight:600}
.comments{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.cmt{font-size:14px;display:flex;flex-direction:column}
.cmt b{font-size:12px;color:var(--ink-soft);font-weight:600}
.cform{display:grid;grid-template-columns:minmax(0,90px) minmax(0,1fr) auto;gap:6px}
.cform input{font-size:14px;padding:8px 10px}
.cform button{background:var(--ink);color:var(--paper);border:0;padding:0 12px;font-size:14px}
.empty{color:var(--ink-soft);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:6px;margin:0}
.note{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <span class="eyebrow">前生 鑑定所</span>
      <button class="snd" id="snd" type="button" aria-pressed="true">🔊 소리 켜짐</button>
    </div>
    <h1>전생 감정소</h1>
    <p class="sub">이름과 생년월일로 당신의 전생을 감정해 드립니다.</p>
  </header>

  <form class="panel" id="f" novalidate>
    <label for="name">이름
      <input id="name" autocomplete="off" maxlength="12" placeholder="예: 오스카" value="오스카">
    </label>
    <label for="birth">생년월일
      <input id="birth" type="date" value="1988-07-14" min="1900-01-01" max="2026-12-31">
    </label>
    <p class="err" id="err" hidden></p>
    <button class="go" type="submit">전생 감정받기</button>
  </form>

  <section class="result" id="result" aria-live="polite">
    <div class="reveal-head" id="rhead">
      <p class="pre" id="rpre"></p>
      <p class="title" id="rtitle"></p>
      <span class="badge" id="rbadge"></span>
    </div>
    <img class="cardimg" id="cardimg" alt="전생 감정서 카드">
    <p class="hint">카드를 길게 눌러 사진으로 저장할 수 있어요.</p>
    <div class="actions">
      <button class="kakao wide" type="button" id="kakao">카카오톡으로 공유하기</button>
      <button class="ghost" type="button" id="save">이미지 저장</button>
      <button class="ghost" type="button" id="post">게시판에 올리기</button>
    </div>
    <p class="toast" id="toast"></p>

    <div class="mistake" id="mistakeBox">
      <span class="label">전생에서 했던 실수</span>
      <span class="caught" id="caught" hidden>실수 발각</span>
      <div id="mistakeLocked">
        <p>전생의 당신이 저지른 결정적인 실수가 봉인되어 있습니다.</p>
      </div>
      <div id="mistakeOpen" hidden>
        <p class="big" id="mistakeText"></p>
        <p id="mistakeLesson"></p>
      </div>
      <button class="reveal" type="button" id="reveal">봉인 풀고 실수 보기</button>
    </div>
  </section>

  <section class="panel" id="board">
    <div class="feed-head">
      <h2>다른 사람들의 전생</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="feed" id="feed">
      <li class="empty">게시판을 불러오는 중이에요.</li>
    </ul>
  </section>
  <p class="note">같은 이름·생년월일은 언제나 같은 전생이 나옵니다. 재미로만 봐 주세요.</p>
</div>

<div class="loader" id="loader" hidden role="status" aria-live="assertive">
  <div class="orb"><span>前生</span></div>
  <p class="lstep" id="lstep">이름의 기운을 읽는 중</p>
  <div class="bar"><i id="lbar"></i></div>
</div>

<canvas id="cv" width="1080" height="1350" hidden></canvas>

<script>
/* ---------- 카카오 설정: 카카오 개발자 콘솔의 JavaScript 키를 넣으면 진짜 카톡 공유창이 열립니다 ---------- */
const KAKAO_JS_KEY = "3a513b20b8ed83ebde81414e63b283d8"; // 카카오 개발자 콘솔 JavaScript 키 (공개용)
const SHARE_URL = location.origin + location.pathname; // 배포된 주소가 그대로 들어갑니다

const LIVES=[
 ["제철 꽃게","🦀",2,"가장 살이 꽉 찬 시기를 정확히 알고 있던 꽃게. 타이밍 하나로 시장 전체를 들썩이게 했습니다.","잘나간다고 옆으로 으스대며 걷다가 그물 속으로 직진함","이번 생엔 잘나갈 때일수록 한 번 더 주변을 살피세요."],
 ["매실","🟢",1,"장독 안에서 1년을 묵묵히 기다려 귀한 청이 된 매실. 기다림이 당신의 특기입니다.","1년 기다리기로 해 놓고 6개월 만에 뚜껑을 열어 버림","조금만 더 참았으면 최고급 매실청이었어요. 지금 하는 일도 조금만 더 버텨 보세요."],
 ["초원을 뛰어다니는 알파카","🦙",1,"바람 부는 고원을 걱정 없이 뛰놀던 알파카. 기분 나쁘면 침을 뱉던 솔직함도 있었죠.","관광객이 사진 찍자 기분 나빠서 카메라에 침을 뱉음","그 사진이 엽서로 팔려 유명해졌죠. 이번 생엔 기분 표현을 한 박자 늦춰 보세요."],
 ["하이에나 무리의 막내","🐾",2,"서열은 꼴찌였지만 먹이는 늘 제일 먼저 찾아내던 막내. 눈치와 생존력은 무리 최고였습니다.","먹이를 제일 먼저 찾아 놓고 신나서 사자에게 먼저 자랑함","좋은 소식은 믿을 사람에게만 알리세요."],
 ["남극에서 줄 잘못 선 펭귄","🐧",1,"다들 바다로 갈 때 혼자 산으로 걸어간 펭귄. 남들과 다른 길을 가도 끝까지 갔습니다.","산 정상에 도착해 뒤돌아보니 무리는 바다에서 생선 파티 중","가끔은 남들이 왜 저쪽으로 가는지 물어보세요."],
 ["하루 종일 생각만 하던 카피바라","🫧",1,"온천에 몸을 담그고 우주의 진리를 고민하던 카피바라. 모두가 당신 옆에서 편안해했습니다.","온천에서 고민만 하다 짝꿍이 다른 카피바라랑 떠나 버림","고민은 짧게, 온천은 길게."],
 ["겨울잠 자다 봄을 세 번 놓친 곰","🐻",1,"한번 잠들면 깨지 않던 곰. 대신 깨어 있을 때는 누구보다 힘이 셌습니다.","겨울잠 들기 전에 알람을 안 맞춤","그래서 봄을 세 번 놓쳤습니다. 이번 생엔 알람 두 개가 필수예요."],
 ["사바나에서 제일 목 짧은 기린","🦒",2,"높은 잎은 못 먹었지만 낮은 덤불 맛집은 다 꿰고 있던 기린. 단점을 개성으로 바꿨습니다.","높은 잎이 부러워 까치발 하다가 목에 담이 걸림","남과 비교하지 말고 내 키에 맞는 맛집을 찾으세요."],
 ["시골집 마당을 지키던 진돗개","🐕",1,"주인이 올 때까지 대문 앞을 떠나지 않던 진돗개. 의리 하나로 동네에서 유명했습니다.","도둑이 고기 한 점 주자 꼬리 흔들며 대문을 열어 줌","의리도 좋지만 사람 보는 눈은 길러 두세요."],
 ["연못 노래자랑 개구리 반장","🐸",1,"비 오는 밤마다 합창단을 이끌던 개구리. 목청과 리더십을 둘 다 가졌습니다.","합창 연습을 너무 크게 해서 뱀이 찾아옴","실력 자랑은 장소를 가려 가며 하세요."],
 ["할머니 장독대 속 3년 묵은 된장","🫙",2,"시간이 지날수록 깊어지는 된장. 늦게 피는 대신 오래 가는 사람이 될 운명이었습니다.","3년을 버텨 놓고 마지막 날 뚜껑 열린 채 소나기를 맞음","끝까지 마무리를 챙기세요."],
 ["수능날 도시락 속 찹쌀떡","🍡",1,"누군가의 합격을 위해 꼭 붙어 있던 찹쌀떡. 남을 응원하는 힘이 큰 영혼입니다.","너무 꽉 붙어서 수험생이 떼어 먹다가 시험 시간을 놓칠 뻔함","응원도 적당히, 숨 쉴 틈은 남겨 주세요."],
 ["붕어빵 틀에서 탈출한 팥","🐟",2,"틀에 갇히기 싫어 뛰쳐나온 팥 한 숟갈. 정해진 모양을 거부하는 자유로운 영혼이었습니다.","겨우 탈출했는데 떨어진 곳이 옆집 호떡 판 위","뛰쳐나가기 전에 착지할 곳을 확인하세요."],
 ["라면에 마지막으로 들어간 계란","🍳",1,"늦게 들어갔지만 모든 맛을 완성한 계란. 마무리가 확실한 사람입니다.","너무 늦게 들어가는 바람에 이미 다 분 면 위에 떨어짐","마무리를 잘하려면 타이밍도 챙겨야 해요."],
 ["김장철 배추 속 막내 무","🥬",1,"양념 속에 숨어 맛있게 익어 가던 무. 조용히 있어도 결국 다들 찾게 됩니다.","양념 속에 너무 잘 숨어서 김장 끝날 때까지 아무도 못 찾음","가끔은 손 들고 '저 여기 있어요' 해 보세요."],
 ["편의점 참치마요 삼각김밥","🍙",1,"언제나 판매량 1등을 지키던 참치마요. 무난함이 최고의 무기라는 걸 증명했습니다.","판매량 1등이라고 방심하다 진열대 뒤에서 유통기한이 지남","잘나갈 때 자기 관리를 하세요."],
 ["비 오는 날 막걸리 옆 파전","🥞",2,"빗소리만 들리면 모두가 그리워하던 파전. 분위기를 만드는 재능을 타고났습니다.","분위기에 취해 옆에 있던 막걸리를 혼자 다 마셔 버림","분위기는 띄우되 주량은 지키세요."],
 ["목욕탕 바나나우유","🍌",2,"때 밀고 나온 사람들에게 최고의 보상이 되어 주던 바나나우유. 존재 자체가 행복이었습니다.","주인이 때 밀기도 전에 탕 안에서 먼저 따여 버림","보상은 일 끝나고 받아야 더 달아요."],
 ["제주 돌담 사이 유채꽃","🌼",1,"거센 바람에도 꺾이지 않고 피어난 유채꽃. 버티는 힘이 남다릅니다.","바람에 버티느라 힘만 주다가 꽃 피우는 걸 잊음","버티는 것만큼 피어나는 것도 중요해요."],
 ["아무도 안 밟은 첫눈","❄️",3,"새벽에 소리 없이 내려 마을 전체를 바꿔 놓은 첫눈. 처음을 여는 사람이 될 운명입니다.","하필 마을 결혼식 날 내려서 신랑 신부가 나란히 미끄러짐","좋은 일도 타이밍을 보고 하세요."],
 ["시골 정자 옆 400살 느티나무","🌳",3,"수백 년 동안 마을의 그늘이 되어 준 느티나무. 당신 곁에는 늘 사람이 모입니다.","그늘 아래서 들은 이야기를 몰래 옆 나무에게 다 옮김","많이 들어도 입은 무겁게."],
 ["바닷가 바위의 따개비","🐚",1,"한번 붙으면 파도가 쳐도 안 떨어지던 따개비. 끈기 하나는 전설급입니다.","평생 꽉 붙어 있던 바위가 알고 보니 고래 등이었음","내가 붙잡고 있는 게 뭔지 가끔 확인하세요."],
 ["가을 산 정상의 마지막 단풍잎","🍁",2,"모두 떨어진 뒤에도 끝까지 붉게 남아 있던 잎. 끝까지 아름다운 사람입니다.","끝까지 버티다 첫눈 오는 날 사진 찍히는 순간에 떨어짐","물러날 때를 아는 것도 멋입니다."],
 ["조선시대 장터 엿장수","🍬",2,"가위 소리 하나로 장터 사람들을 다 불러 모은 엿장수. 말솜씨로 먹고살던 사람입니다.","가위 장단에 신나서 엿을 공짜로 다 나눠 줌","말솜씨만큼 계산도 챙기세요."],
 ["수라간에서 간 보던 나인","🥢",3,"임금님 밥상의 간을 책임지던 나인. 혀끝 감각이 지금도 남아 있습니다.","간을 보다 보다 임금님 수라상을 절반 먹어 버림","그래서 지금도 요리하면서 반은 먹어요."],
 ["주막 소문 담당 주모","🍶",2,"마을의 모든 소식이 당신을 거쳐 갔습니다. 사람 마음을 읽는 데 선수였습니다.","열심히 퍼뜨린 소문의 주인공이 알고 보니 자기였음","남 이야기는 적당히 하세요."],
 ["실크로드 낙타 몰이 상인","🐫",3,"사막을 건너며 동서양을 잇던 상인. 낯선 곳에서도 금방 친구를 만드는 사람입니다.","지름길이라며 우기다 같은 오아시스를 세 바퀴 돎","새 길은 지도부터 확인하세요."],
 ["고려청자 몰래 붙이던 도공","🏺",2,"금 간 청자를 감쪽같이 고쳐 놓던 도공. 손재주와 수습 능력이 뛰어납니다.","너무 감쪽같이 붙여서 진짜 명품이 가짜로 오해받음","실력은 숨기지 말고 드러내세요."],
 ["교실 창가 자리 의자","🪑",1,"햇살 가득한 창가에서 수많은 졸음을 지켜본 의자. 사람을 편하게 해 주는 기운이 있습니다.","졸던 학생을 너무 편하게 받쳐 줘서 시험 날까지 안 깨움","편하게 해 주는 것만이 다정함은 아니에요."],
 ["공중전화 박스 안 동전","🪙",1,"누군가의 간절한 통화를 이어 준 동전 하나. 작은 도움이 큰 의미가 되는 사람입니다.","가장 간절한 통화 중에 데구루루 굴러 하수구로 빠짐","중요한 순간엔 끝까지 자리를 지키세요."],
 ["문방구 뽑기 기계 1등 상품","🎁",3,"아무도 뽑지 못해 모두가 탐내던 1등 상품. 쉽게 얻을 수 없는 귀한 사람입니다.","안 뽑히려고 버티다가 문방구가 문을 닫아 버림","튕기는 것도 적당히 하세요."],
 ["바다를 건너던 철새 대장","🕊️",3,"수천 킬로를 날며 무리를 이끈 철새 대장. 방향 감각과 책임감을 타고났습니다.","따뜻한 남쪽 대신 무리를 이끌고 시베리아로 감","방향 감각을 믿기 전에 한 번 더 확인하세요."],
 ["동굴 벽화 그리던 원시인","🖐️",2,"아무도 안 시켰는데 벽에 그림을 남긴 원시인. 기록하고 표현하는 걸 좋아합니다.","벽화에 몰입하다 실수로 동굴 입구까지 그림으로 막아 버림","몰입할 땐 주변도 보세요."],
 ["피라미드 공사장 점심 담당","🍞",2,"수만 명의 일꾼을 먹여 살린 빵 담당. 사람을 챙기는 게 천성입니다.","빵 굽다 졸아서 꼭대기 돌 대신 식빵을 올려 보냄","피곤하면 쉬어 가세요."],
 ["해적선 앵무새","🦜",2,"선장의 어깨에서 모든 비밀을 들은 앵무새. 입이 무겁지는 않았습니다.","선장의 보물 위치를 옆 배 앵무새에게 그대로 따라 말함","비밀은 따라 말하지 마세요."],
 ["바닷속 문어 박사","🐙",3,"여덟 다리로 동시에 여덟 가지 일을 하던 문어. 멀티태스킹의 원조입니다.","여덟 가지 일을 동시에 하다 자기 다리끼리 묶여 버림","멀티태스킹은 세 개까지만."],
 ["시장 생선가게 고양이","🐈",1,"매일 생선 한 마리씩 얻어 가던 고양이. 애교로 원하는 걸 얻는 법을 알았습니다.","하루 한 마리로 만족 못 하고 통째로 물고 도망감","꾸준한 게 한 방보다 낫습니다."],
 ["밤하늘 별똥별","🌠",3,"누군가의 소원을 들어주고 사라진 별똥별. 짧게 머물러도 오래 기억됩니다.","남의 소원 들어주느라 바빠서 자기 소원 비는 걸 잊음","이번 생엔 나를 위한 소원도 챙기세요."],
 ["한여름 수박의 가운데 한 입","🍉",2,"모두가 가장 먼저 먹고 싶어 하던 수박 한가운데. 핵심만 찌르는 사람입니다.","가운데만 되고 싶어 씨를 다 밀어내다 수박이 쩍 갈라짐","핵심도 좋지만 주변도 챙기세요."],
 ["군고구마 리어카","🍠",1,"추운 겨울 골목을 따뜻하게 데우던 군고구마 리어카. 존재만으로 위로가 됩니다.","골목을 더 따뜻하게 하려다 고구마를 전부 숯으로 만듦","열정은 약불로 오래."],
 ["놀이터 미끄럼틀","🛝",1,"수많은 아이들의 첫 용기를 받아 준 미끄럼틀. 사람을 출발시키는 힘이 있습니다.","한여름 땡볕에 너무 뜨거워져서 아이들 엉덩이를 다 데움","좋은 자리일수록 온도 조절이 필요해요."],
 ["가을 운동회 박 터뜨리기 박","🎊",2,"모두가 콩주머니를 던지며 기다리던 박. 터지는 순간 운동장 전체가 환호했습니다.","너무 튼튼하게 버티다 운동회가 해 질 때까지 안 터짐","버티는 것도 좋지만 터질 땐 시원하게 터져 주세요."],
 ["찜질방 양머리 수건","🐑",1,"누구든 쓰면 귀여워지게 만들던 양머리 수건. 사람들의 긴장을 풀어 주는 재능이 있습니다.","너무 꽉 말려서 주인이 하루 종일 귀가 안 들림","편하게 해 주는 것도 적당히."],
 ["시골 버스 정류장 고양이","🐈‍⬛",1,"버스 시간표보다 정확하게 정류장을 지키던 고양이. 동네 사람들의 시계였습니다.","버스 기사님이 주는 간식 받으러 올라탔다가 읍내까지 감","맛있는 것 앞에서는 목적지를 먼저 확인하세요."],
 ["정월대보름 부럼 호두","🌰",1,"딱 하고 깨지는 소리로 한 해 액운을 쫓던 호두. 존재 자체가 행운입니다.","너무 단단해서 할아버지 틀니를 깨뜨림","강한 것도 좋지만 상대를 봐 가며."],
 ["동네 목욕탕 때밀이 장인","🧽",2,"한 번 밀면 묵은 피로까지 벗겨 내던 장인. 사람을 새것처럼 만드는 손을 가졌습니다.","너무 열정적으로 밀다 손님 등에 있던 문신까지 지움","열정은 손님 사정도 봐 가며."],
 ["설날 떡국 속 떡 한 조각","🥣",1,"한 그릇 먹을 때마다 한 살을 선물하던 떡. 누구에게나 시간을 쌓아 준 존재입니다.","한 사람 그릇에 몰래 열 조각 들어가서 그 사람이 하루에 열 살 먹음","나눌 땐 공평하게."],
 ["장마철 우산꽂이 속 비닐우산","☂️",1,"누구 것인지 모르지만 늘 누군가를 지켜 준 비닐우산. 이름 없이 착한 일을 하는 사람입니다.","바람 한 번에 뒤집혀서 주인보다 먼저 날아감","중요한 순간엔 자리를 지켜 주세요."],
 ["한강 공원 치킨 배달부","🍗",2,"휴대폰 하나로 넓은 공원에서 손님을 정확히 찾아내던 배달부. 길 찾기의 달인입니다.","돗자리를 잘못 찾아 다른 사람들에게 치킨을 주고 같이 먹음","친화력은 좋지만 주소는 두 번 확인."],
 ["조선시대 활쏘기 명궁","🏹",3,"백 걸음 밖의 과녁도 꿰뚫던 명궁. 목표를 정하면 반드시 맞히는 사람입니다.","왕 앞에서 시범을 보이다 날아가는 까치를 쏘려다 갓을 맞힘","집중할 땐 한 가지만."],
 ["비 맞으며 우는 청개구리","🐸",1,"엄마 말 반대로만 하다가 강가에서 울던 청개구리. 반전 매력의 원조입니다.","엄마가 '산에 묻어 다오' 할 때만 말을 들음","이번 생엔 중요한 말은 그대로 들어 보세요."],
 ["한겨울 붕어빵 아저씨","🐟",2,"동네 겨울을 책임지던 붕어빵 아저씨. 따뜻한 걸 나누는 게 행복인 사람입니다.","팥 대신 슈크림을 넣었다가 동네 붕어빵 전쟁을 일으킴","새로운 시도는 단골에게 먼저 물어보고."],
 ["사막의 선인장","🌵",1,"비 한 방울로 한 달을 버티던 선인장. 적은 것으로도 잘 사는 사람입니다.","안아 달라는 여우를 진짜로 안아 줌","다정함도 상대가 다치지 않게."],
 ["바다거북 할머니","🐢",3,"100년 넘게 바다를 여행하며 수많은 해변을 기억하던 거북. 지혜와 끈기를 모두 가졌습니다.","알 낳으러 온 해변이 리조트로 바뀐 걸 모르고 수영장에 알을 낳음","변화하는 세상도 한 번씩 확인하세요."],
 ["궁궐 기와지붕 위 잡상","🗿",3,"지붕 끝에서 수백 년 동안 궁을 지키던 잡상. 묵묵한 책임감의 상징입니다.","너무 오래 서 있다가 비둘기 쉼터가 됨","지킬 땐 지키더라도 가끔 몸은 털어 주세요."],
 ["학교 앞 문방구 주인 할머니","👵",2,"외상도 웃으며 받아 주던 할머니. 아이들에게 첫 단골 가게를 만들어 준 분입니다.","외상 장부를 너무 꼼꼼히 써서 30년 뒤 동창회에서 받아 냄","정은 넉넉하게, 장부는 적당히."],
 ["고양이 집사의 레이저 포인터","🔴",2,"빨간 점 하나로 고양이를 한 시간 뛰게 만든 포인터. 사람을 움직이는 묘한 힘이 있습니다.","고양이가 영원히 못 잡게 해서 결국 집사가 혼남","가끔은 상대에게도 성취감을 주세요."],
 ["우체국 빨간 우체통","📮",2,"수많은 사연과 고백을 품고 있던 우체통. 비밀을 지키는 능력이 탁월합니다.","너무 많은 편지를 품다가 배가 불러 입이 안 닫힘","혼자 다 품지 말고 가끔은 털어놓으세요."],
 ["고깃집 불판 위 마늘","🧄",1,"고기 옆에서 조용히 익다가 마지막에 제일 맛있어지던 마늘. 늦게 빛나는 사람입니다.","너무 오래 버티다 숯이 되어 아무도 못 먹음","기다림도 타이밍이 중요해요."],
 ["야구장 응원단장","📣",2,"지는 경기에서도 끝까지 목이 터져라 외치던 응원단장. 분위기를 바꾸는 사람입니다.","응원에 너무 몰입해서 상대 팀 응원가까지 따라 부름","열정은 방향을 확인하고."],
 ["마을 대장간 대장장이","⚒️",2,"뜨거운 쇠를 두드려 마을의 모든 연장을 만든 장인. 단단한 결과를 만드는 사람입니다.","호미를 너무 튼튼하게 만들어 아무도 다시 안 사러 옴","좋은 물건도 다음 손님은 생각해야죠."],
 ["새벽 수산시장 경매사","🐟",3,"알아들을 수 없는 속도로 가격을 외치며 시장을 지휘한 경매사. 결단력과 순발력의 끝판왕입니다.","너무 빨리 외쳐서 자기 점심 생선을 다른 사람에게 팔아 버림","빠른 것도 좋지만 내 것은 챙기세요."],
 ["동네 전파사 라디오","📻",1,"하루 종일 노래와 소식을 들려주던 라디오. 혼자 있는 사람의 좋은 친구였습니다.","새벽에 볼륨이 혼자 올라가 온 동네를 깨움","분위기는 시간을 봐 가며 띄우세요."],
 ["한옥 마루 밑 강아지","🐶",1,"여름이면 시원한 마루 밑에서 세상 구경을 하던 강아지. 좋은 자리를 찾는 눈이 있습니다.","너무 시원해서 잠들었다가 주인 가족 여행을 놓침","편한 자리에서도 귀는 열어 두세요."],
 ["빙하 위 북극곰","🐻‍❄️",3,"끝없는 얼음 위를 혼자 걸으며 바다를 누비던 북극곰. 고독을 힘으로 바꾸는 사람입니다.","물개를 기다리다 얼음이 떠내려가 다른 나라에 도착함","기다릴 땐 발밑도 확인하세요."],
 ["잔칫집 국수 삶는 이모","🍜",2,"수백 그릇을 삶아도 면 한 가닥 불리지 않던 이모. 사람 챙기는 손이 빠릅니다.","손님 다 먹이고 나니 자기 먹을 국수가 하나도 안 남음","남 챙기는 만큼 나도 챙기세요."],
 ["바닷가 등대지기","🗼",3,"폭풍우 치는 밤에도 불을 꺼뜨리지 않던 등대지기. 누군가의 길이 되어 주는 사람입니다.","너무 밝게 비추다 근처 연인들의 데이트를 다 들킴","빛도 적당히 비춰 주세요."],
 ["논두렁 허수아비","🧑‍🌾",1,"참새들에게 겁을 주는 척하지만 사실 친구였던 허수아비. 겉은 무섭고 속은 다정합니다.","참새들과 너무 친해져서 논을 같이 지켜 주지 않음","친해도 맡은 일은 해야죠."],
 ["학교 급식실 돈가스","🍖",2,"돈가스 나오는 날이면 전교생이 달리게 만든 돈가스. 사람들을 설레게 하는 존재입니다.","너무 인기가 많아 급식 줄에서 싸움을 일으킴","인기도 관리가 필요합니다."],
 ["오일장 뻥튀기 기계","💥",2,"'뻥이요' 한 마디로 온 장터를 놀라게 한 기계. 존재감이 확실한 사람입니다.","예고 없이 터져서 옆집 할아버지가 장날마다 놀람","큰 소리 낼 땐 미리 알려 주세요."],
 ["남산 꼭대기 사랑의 자물쇠","🔒",1,"수많은 약속을 꼭 붙잡고 있던 자물쇠. 한번 맺은 인연은 끝까지 지킵니다.","주인이 헤어졌는데도 계속 붙어 있어서 철거반에게 끌려감","놓아줄 때를 아는 것도 사랑이에요."],
 ["산꼭대기 다람쥐 도토리 은행장","🐿️",2,"가을마다 도토리를 백 곳에 숨겨 두던 다람쥐. 미래를 대비하는 계획가입니다.","숨긴 장소를 반이나 잊어버려서 산에 참나무 숲이 생김","기록하는 습관을 들이세요. 실수도 가끔은 숲이 되지만요."],
 ["궁중 화원","🖌️",3,"임금님 초상화를 그리던 궁중 화가. 사람의 진짜 모습을 알아보는 눈이 있습니다.","임금님 얼굴을 너무 사실적으로 그려서 점을 하나 지우라는 명을 받음","솔직함에도 적당한 포장이 필요합니다."],
 ["장독대 위 고추잠자리","🌾",1,"늦여름 장독대 위를 빙빙 돌던 고추잠자리. 계절이 바뀌는 걸 제일 먼저 알립니다.","아이가 내민 손가락에 앉았다가 3일 동안 붙잡혀 있음","너무 쉽게 마음을 주지 마세요."],
 ["캠핑장 마시멜로","🍡",1,"모닥불 앞에서 모두를 아이처럼 웃게 만든 마시멜로. 분위기 메이커입니다.","너무 신나서 불 속으로 직접 뛰어들어 숯이 됨","열정과 화상은 한 끗 차이."],
 ["연날리기 대회 방패연","🪁",2,"하늘 높이 올라 마을 사람들의 소원을 실어 나르던 연. 꿈을 높이 띄우는 사람입니다.","너무 높이 날다 줄이 끊겨 옆 마을 우승을 도와줌","높이 날더라도 연결된 끈은 잘 챙기세요."],
 ["탐험대 나침반","🧭",3,"아무도 가 보지 못한 곳으로 탐험대를 이끈 나침반. 길을 잃은 사람에게 방향이 되어 줍니다.","자석 옆에 놓였다가 탐험대를 반대 방향으로 이끔","주변 영향에 흔들리지 마세요."],
 ["어촌 마을 해녀","🌊",3,"숨 한 번으로 바다 깊이 들어가 보물을 건져 오던 해녀. 용기와 체력을 모두 가졌습니다.","전복 따다 너무 신나서 문어랑 줄다리기를 한 시간 함","가끔은 놓아주는 게 이기는 거예요."],
 ["놀이공원 회전목마 백마","🎠",2,"수십 년 동안 아이들을 태우고 같은 자리를 돈 백마. 꾸준함으로 행복을 만든 존재입니다.","한 번쯤 앞의 말을 앞지르고 싶어서 힘주다 기둥이 휘어짐","남과 비교 말고 내 속도로."],
 ["시장 국밥집 가마솥","🍲",2,"40년 동안 불을 꺼뜨리지 않은 가마솥. 오래 끓일수록 깊어지는 사람입니다.","사장님이 모르고 뚜껑을 덮은 채 손님에게 보여 줌","좋은 건 숨기지 말고 보여 주세요."],
 ["골목대장 참새","🐦",1,"전깃줄 위에서 골목 소식을 다 꿰고 있던 참새. 정보력과 수다가 특기입니다.","방앗간 앞을 그냥 지나치지 못해 결국 체함","좋아하는 것도 적당히."],
 ["사진관 흑백 사진기","📷",2,"수많은 가족의 첫 사진을 남긴 사진기. 소중한 순간을 붙잡는 재능이 있습니다.","하필 할아버지가 눈 감는 순간마다 셔터가 눌림","결정적 순간은 한 번 더 확인하세요."],
 ["밤하늘 북극성","⭐",3,"한자리에서 수천 년 동안 길잡이가 되어 준 별. 흔들리지 않는 기준이 되는 사람입니다.","너무 한자리만 지키다 다른 별들 파티에 한 번도 못 감","가끔은 자리를 비워도 괜찮아요."],
 ["물레방아","💧",1,"쉬지 않고 돌면서 마을의 곡식을 찧어 준 물레방아. 성실함의 아이콘입니다.","가뭄에도 돌고 싶어서 혼자 빈 바퀴를 돌림","쉴 때는 쉬어야 오래 돌아요."],
 ["전래동화 속 도깨비 방망이","🪄",3,"'금 나와라 뚝딱' 한 마디로 소원을 들어주던 방망이. 사람에게 기회를 만들어 줍니다.","혹부리 영감의 혹을 떼야 하는데 실수로 하나 더 붙임","좋은 일도 상대를 확인하고 하세요."],
 ["양봉장 일벌","🐝",1,"하루에 꽃 수천 송이를 오가던 일벌. 맡은 일은 끝까지 해내는 사람입니다.","꿀 모으다 너무 신나서 옆 동네 벌집에 꿀을 납품함","노력은 내 집으로."],
 ["할아버지 장기판 위 차","♟️",2,"장기판을 직선으로 시원하게 가로지르던 차. 망설임 없는 추진력의 소유자입니다.","너무 앞만 보고 달리다 상대 포에게 잡힘","직진도 좋지만 옆도 보세요."],
 ["두더지 잡기 게임 두더지","🦫",1,"망치를 피해 쉴 새 없이 고개를 내밀던 두더지. 맞아도 다시 일어나는 회복력의 소유자입니다.","나올 타이밍을 너무 잘 맞춰서 최고 점수의 희생양이 됨","눈치껏 한 박자 늦게 나와 보세요."],
 ["궁궐 문지기 해치상","🦁",3,"옳고 그름을 가린다는 상상의 동물 해치. 정의감이 남다른 사람입니다.","너무 공정해서 임금님 간식 반입도 막아 버림","원칙에도 융통성 한 스푼."],
 ["오락실 펌프 기계","🕹️",2,"수많은 청춘의 땀을 받아 낸 오락실 펌프. 사람들을 들썩이게 만드는 에너지가 있습니다.","너무 어려운 곡만 틀어서 손님들이 다리에 쥐 남","가끔은 쉬운 곡도 틀어 주세요."],
 ["어항 속 금붕어","🐠",1,"3초마다 세상을 새롭게 바라보던 금붕어. 매일이 새로운 사람입니다.","밥 먹은 걸 잊고 하루에 밥을 열 번 먹음","중요한 건 메모해 두세요."],
 ["산사의 풍경 종","🔔",2,"바람이 불 때마다 맑은 소리로 마음을 씻어 주던 풍경. 곁에 있으면 마음이 편해지는 사람입니다.","태풍 오는 날 너무 신나게 울려 스님들이 밤새 못 잠","좋은 소리도 때를 가려서."],
 ["밀림의 나무늘보","🦥",1,"하루 20시간을 자며 느긋하게 살던 나무늘보. 서두르지 않아도 결국 도착하는 사람입니다.","나무에서 내려오는 데 일주일 걸려서 생일 파티를 놓침","중요한 날엔 조금만 서둘러 보세요."],
 ["장터 약장수","💊",2,"한 번 입을 열면 구경꾼이 구름처럼 모이던 약장수. 말로 사람 마음을 움직이는 재주꾼입니다.","너무 신나게 홍보하다 자기 약을 자기가 다 사 버림","말에 취하지 마세요."],
 ["돌고래 쇼 주인공","🐬",3,"공중 세 바퀴 돌기로 바다 전체를 놀라게 한 돌고래. 무대 체질입니다.","관객석에 물을 너무 많이 튀겨 첫 줄 손님들이 모두 우비를 삼","무대에서도 관객 배려는 필수."],
 ["동네 철물점 만능 열쇠","🗝️",2,"어떤 문이든 열어 주던 만능 열쇠. 막힌 일을 풀어 주는 해결사입니다.","자기 집 열쇠만 못 찾음","남의 문제만큼 내 문제도 챙기세요."],
 ["논두렁 우렁각시","🐌",3,"몰래 밥상을 차려 두고 사라지던 우렁각시. 티 안 내고 챙기는 다정함의 원조입니다.","너무 몰래 해서 총각이 귀신 들린 줄 알고 무당을 부름","가끔은 생색도 내도 돼요."],
 ["시골 장날 솜사탕","🍭",1,"구름처럼 부풀어 아이들 얼굴에 웃음을 그려 주던 솜사탕. 달콤함이 특기입니다.","비 오는 장날 나갔다가 순식간에 녹아 막대기만 남음","날씨는 꼭 확인하고 나가세요."],
 ["파도 타는 서퍼 갈매기","🐦",2,"사람보다 파도를 잘 타던 갈매기. 흐름을 읽고 즐기는 사람입니다.","관광객 새우깡에 정신 팔려 인생 최고의 파도를 놓침","눈앞의 간식보다 큰 기회를 보세요."],
 ["가마솥 누룽지","🍘",1,"밥 다 퍼낸 뒤에야 진가가 드러나는 누룽지. 마지막에 웃는 사람입니다.","너무 늦게까지 버티다 숭늉이 되어 버림","기다리는 것도 정도껏."],

 ["새벽마다 우는 수탉","🐓",1,"해 뜨기 전에 온 마을을 깨우던 수탉. 하루를 여는 책임감이 남다릅니다.","시계를 잘못 봐서 새벽 두 시에 목청껏 울어 버림","부지런함도 시간을 확인하고."],
 ["낮잠 자는 판다","🐼",2,"대나무만 있으면 세상 걱정이 없던 판다. 존재만으로 사람들을 웃게 만드는 사람입니다.","사육사 앞에서만 귀여운 척하다 CCTV에 다 찍힘","앞뒤가 같아야 진짜 매력이에요."],
 ["강가의 수달","🦦",2,"조개를 배 위에 올려놓고 돌로 깨 먹던 수달. 도구를 쓰는 머리가 비상합니다.","제일 아끼는 돌을 깜빡하고 강물에 떨어뜨림","소중한 건 주머니에 넣어 두세요."],
 ["논에 사는 미꾸라지","🐟",1,"진흙 속을 요리조리 빠져나가던 미꾸라지. 위기 탈출 능력이 최고입니다.","너무 잘 빠져나가다 추어탕집 수조로 들어감","도망칠 땐 방향부터."],
 ["시골 외양간 황소","🐂",1,"묵묵히 밭을 갈던 황소. 성실함으로 한 집안을 일으켰습니다.","빨간 고무장갑 보고 흥분해서 주인을 밭 끝까지 쫓아감","감정은 색깔 말고 사실에 반응하세요."],
 ["바다를 떠다니는 해파리","🫧",1,"물결 따라 둥실둥실 떠다니던 해파리. 흐름에 몸을 맡길 줄 아는 사람입니다.","떠다니다 보니 해수욕장 한가운데서 사람들을 다 쏘아 버림","흘러가더라도 가는 곳은 확인하세요."],
 ["숲속의 부엉이 선생님","🦉",2,"밤새 깨어 숲의 일을 다 알고 있던 부엉이. 모두가 고민 상담을 하러 왔습니다.","낮에 열린 숲속 회의에서 혼자 꾸벅꾸벅 졸다 반장으로 뽑힘","자리에 없으면 일이 몰려와요."],
 ["동물원 홍학","🦩",1,"한 다리로 몇 시간이고 서 있던 홍학. 균형 감각이 타고났습니다.","한 다리로 너무 오래 서 있다가 어느 다리였는지 잊음","가끔은 두 발로 쉬어 가세요."],
 ["사막여우","🦊",2,"큰 귀로 모래 밑 소리까지 듣던 사막여우. 남의 말을 잘 들어주는 사람입니다.","귀가 너무 밝아 친구들 뒷담화를 다 들어 버림","모르는 게 약일 때도 있어요."],
 ["알래스카 썰매개","🐕",2,"눈보라 속에서도 썰매를 끌고 달리던 썰매개. 팀을 위해 뛰는 사람입니다.","너무 신나게 달려서 썰매와 주인을 출발선에 두고 옴","혼자 앞서가지 말고 팀을 보세요."],
 ["캥거루 엄마","🦘",2,"주머니에 아기를 넣고 초원을 뛰어다니던 캥거루. 품이 넓은 사람입니다.","주머니에 간식을 넣어 두다 아기가 3년 동안 안 나옴","품어 주는 것도 독립할 때까지만."],
 ["갯벌의 짱뚱어","🐟",1,"물 밖에서도 폴짝폴짝 뛰어다니던 짱뚱어. 어디서든 적응하는 사람입니다.","갯벌 점프 대회 나갔다가 너무 높이 뛰어 갈매기 입으로 들어감","실력 발휘는 안전한 곳에서."],
 ["나무에 매달린 코알라","🐨",1,"하루 스무 시간을 나무에 매달려 자던 코알라. 쉼의 가치를 아는 사람입니다.","너무 꽉 껴안고 자다 보니 나무가 아니라 사육사 다리였음","안기기 전에 상대를 확인하세요."],
 ["황제펭귄 아빠","🐧",3,"남극 한겨울에 알을 발등에 품고 넉 달을 버틴 펭귄 아빠. 책임감의 끝판왕입니다.","알을 품다 깜빡 졸아 옆집 알이랑 바뀜","지금 품고 있는 게 내 것인지 가끔 확인하세요."],
 ["정글의 고릴라 대장","🦍",3,"가슴을 두드리면 정글 전체가 조용해지던 고릴라 대장. 든든한 리더입니다.","가슴을 너무 세게 두드려 사흘 동안 숨이 차서 말을 못함","힘자랑은 적당히."],
 ["논두렁 백로","🕊️",1,"하얀 깃털로 논 위를 우아하게 걷던 백로. 어디서든 품위를 잃지 않습니다.","우아하게 걷다 진흙탕에 빠져 까마귀로 오해받음","겉모습보다 발밑을 챙기세요."],
 ["동굴 박쥐","🦇",1,"거꾸로 매달려 세상을 다르게 보던 박쥐. 남다른 관점을 가진 사람입니다.","거꾸로만 보다가 지도를 거꾸로 읽어 동굴을 못 찾음","가끔은 똑바로도 봐 주세요."],
 ["깊은 바다 아귀","🐡",2,"머리 위 작은 불빛으로 깊은 바다를 밝히던 아귀. 어둠 속에서도 길을 찾는 사람입니다.","불빛을 너무 밝게 켜서 자기보다 큰 상어를 불러들임","관심 끌기도 적당히."],
 ["벌집 입구 경비대 꿀벌","🐝",2,"벌집 입구를 지키던 경비대 꿀벌. 동료를 지키는 용기가 있습니다.","너무 열심히 지키다 퇴근하는 동료까지 못 들어오게 막음","지키는 대상이 누군지 기억하세요."],
 ["초원의 얼룩말","🦓",1,"줄무늬 하나로 사자 눈을 어지럽게 만들던 얼룩말. 자기만의 무늬가 있는 사람입니다.","단체 사진에서 친구들이랑 무늬가 겹쳐 아무도 못 찾음","가끔은 혼자 돋보여도 괜찮아요."],
 ["뒷산 멧돼지","🐗",1,"한번 마음먹으면 산을 그대로 직진하던 멧돼지. 추진력 하나는 최고입니다.","직진하다 등산객 도시락을 통째로 먹어 뉴스에 나옴","직진도 남의 밥상 앞에선 멈추세요."],
 ["노래하는 혹등고래","🐋",3,"노래 한 곡으로 바다 건너 친구를 부르던 고래. 마음을 멀리까지 전하는 사람입니다.","너무 감동적으로 노래하다 근처 배들이 다 따라와 바닷길이 막힘","감동도 주변 사정을 봐 가며."],
 ["봄날 나비","🦋",1,"꽃마다 들러 인사하던 나비. 사람 사이를 이어 주는 재능이 있습니다.","꽃 하나하나 인사하다 해가 져서 집을 못 찾음","인사는 짧게, 귀가는 일찍."],
 ["여름밤 반딧불이","✨",2,"작은 빛으로 여름밤을 수놓던 반딧불이. 조용히 반짝이는 사람입니다.","친구들과 단체로 불을 켰다가 마을 사람들이 UFO라고 신고함","빛날 땐 한 번쯤 예고하세요."],
 ["달팽이 우편배달부","🐌",1,"느리지만 단 한 통의 편지도 잃어버리지 않던 달팽이. 믿음직한 사람입니다.","연애편지를 배달했는데 도착하니 두 사람이 이미 결혼해 있음","급한 일은 빠른 친구에게 부탁하세요."],
 ["개미 군단 행동대장","🐜",1,"자기 몸의 50배를 들던 개미. 묵묵히 큰일을 해내는 사람입니다.","과자 부스러기를 옮기다 길을 잃어 다른 개미굴에 납품함","열심히 하기 전에 방향부터 확인하세요."],
 ["서당 앞 까치","🐦",2,"반가운 손님이 올 때마다 먼저 알리던 까치. 좋은 소식을 몰고 다니는 사람입니다.","반가운 소식인 줄 알고 울었는데 빚쟁이가 찾아옴","소식은 확인하고 전하세요."],
 ["망보는 미어캣","🐾",1,"두 발로 서서 망을 보던 미어캣. 주변을 살피는 눈이 예리합니다.","망보다가 관광객 휴대폰 화면에 정신 팔려 매가 지나가는 걸 놓침","폰보다 주변을 보세요."],
 ["수줍은 고슴도치","🦔",1,"겉은 뾰족해도 속은 말랑했던 고슴도치. 반전 매력의 소유자입니다.","반가워서 안아 주려다 친구 풍선을 다 터뜨림","반가움도 조심스럽게."],
 ["시골 마당 대장 닭","🐔",1,"마당의 병아리들을 다 거느리던 대장 닭. 사람들을 챙기는 리더입니다.","병아리 줄 세우다 자기가 맨 뒤에 서서 모이를 못 먹음","남 챙기다 나를 잊지 마세요."],
 ["밀림의 앵무새 가수","🦜",2,"한번 들은 노래는 다 따라 부르던 앵무새. 흉내 내기의 천재입니다.","주인 잔소리를 너무 똑같이 따라 해서 손님들 앞에서 망신시킴","모든 말을 따라 하진 마세요."],
 ["독수리 정찰대장","🦅",3,"구름 위에서 들판 전체를 내려다보던 독수리. 큰 그림을 보는 사람입니다.","높이 날며 폼 잡다가 비행기랑 눈이 마주침","큰 그림 볼 때도 주변 교통은 확인하세요."],
 ["사바나의 코끼리 할머니","🐘",3,"40년 전 물웅덩이 위치까지 기억하던 코끼리. 무리를 살리는 지혜를 가졌습니다.","기억력이 너무 좋아 친구가 30년 전에 한 실수까지 다 기억함","잊어 줄 줄 아는 것도 지혜예요."],
 ["숲속 딱따구리","🪵",1,"하루에 나무를 만 번 두드리던 딱따구리. 한 우물을 파는 사람입니다.","너무 열심히 쪼다가 자기 집 나무를 쓰러뜨림","적당히 쪼아야 집이 남아요."],
 ["볼 빵빵 햄스터","🐹",1,"볼에 해바라기씨를 가득 넣고 다니던 햄스터. 알뜰살뜰 모으는 사람입니다.","볼에 너무 많이 넣어서 집 입구에 끼어 버림","모으는 것도 들어갈 만큼만."],
 ["바닷가 소라게","🦀",1,"몸에 맞는 집을 찾아 끊임없이 이사하던 소라게. 변화에 강한 사람입니다.","예쁜 집을 찾다가 생수병 뚜껑에 들어가 버림","겉보다 살기 편한 집을 고르세요."],
 ["목장의 양치기 개","🐕",2,"수백 마리 양을 혼자 몰던 보더콜리. 정리정돈의 천재입니다.","양을 너무 잘 몰아서 옆 목장 양까지 다 데려옴","내 것만 챙겨도 충분해요."],
 ["깊은 산속 호랑이","🐅",3,"한번 포효하면 산짐승이 모두 숨던 호랑이. 타고난 카리스마의 소유자입니다.","곶감이 무섭다는 말을 듣고 진짜 곶감한테서 도망감","소문만 듣고 겁먹지 마세요."],
 ["우물 안 개구리","🐸",1,"우물 안에서 하늘을 바라보며 꿈을 키운 개구리. 작은 곳에서도 큰 꿈을 꿉니다.","우물 밖으로 나왔다가 너무 넓어서 다시 들어감","넓은 세상, 조금씩 익숙해지면 돼요."],
 ["갈라파고스 거북이","🐢",2,"200년 동안 같은 섬을 지킨 거북. 느긋하게 오래 가는 사람입니다.","친구한테 '금방 갈게' 해 놓고 50년 뒤에 도착함","'금방'의 기준을 맞춰 보세요."],
 /* ---- 음식 ---- */
 ["떡볶이 국물 속 어묵","🍢",1,"떡볶이보다 인기 많던 어묵. 조연이어도 주인공처럼 빛나는 사람입니다.","국물을 너무 많이 흡수해서 주인 몫 국물까지 다 마셔 버림","욕심은 적당히 흡수하세요."],
 ["삼겹살 불판의 김치","🥬",1,"고기 기름에 노릇하게 구워지던 김치. 누구와도 잘 어울립니다.","고기 옆자리 지키려다 불판에 눌어붙어 끝까지 못 떨어짐","어울리는 것과 들러붙는 건 달라요."],
 ["치킨의 첫 번째 닭다리","🍗",2,"모두가 노리던 바로 그 닭다리. 늘 1순위로 선택받는 사람입니다.","가족끼리 서로 양보하다 결국 아무도 안 먹고 식어 버림","좋은 건 따뜻할 때 나누세요."],
 ["짜장면 위 완두콩","🟢",1,"작지만 짜장면의 화룡점정이었던 완두콩. 작은 디테일로 완성도를 높이는 사람입니다.","아이들이 골라내는 바람에 평생 그릇 가장자리만 구경함","알아봐 주는 사람을 찾아가세요."],
 ["탕수육 찍먹 소스","🥣",1,"찍먹파의 자존심을 지키던 소스. 원칙이 확실한 사람입니다.","부먹파 손님에게 걸려 통째로 부어짐","원칙도 상대를 봐 가며."],
 ["엄마표 김밥 꽁다리","🍙",2,"썰 때마다 몰래 먹던 꽁다리. 가장 맛있지만 가장 먼저 사라지는 존재입니다.","도시락에 들어가지도 못하고 부엌에서 다 먹힘","가끔은 무대에도 올라가 보세요."],
 ["호떡 속 꿀","🍯",1,"한 입 베어 물면 터져 나오던 달콤한 꿀. 반전 매력의 소유자입니다.","너무 뜨겁게 터져서 첫 손님 입천장을 다 데움","반전도 온도 조절이 필요해요."],
 ["팥빙수 위 떡","🍧",1,"얼음 사이에서도 쫀득함을 잃지 않던 떡. 어떤 환경에서도 자기다움을 지키는 사람입니다.","얼음 속에서 버티다 꽁꽁 얼어 손님 이가 부러질 뻔함","너무 굳어 있지 마세요."],
 ["명절 동그랑땡","🥮",2,"명절마다 수백 개씩 부쳐지던 동그랑땡. 모두가 모이는 자리를 빛내는 사람입니다.","몰래 집어 먹는 손에 다 뺏겨 차례상에 하나도 못 올라감","중요한 자리는 먼저 맡아 두세요."],
 ["컵라면 뚜껑 위 나무젓가락","🥢",1,"3분 동안 뚜껑을 꾹 눌러 주던 젓가락. 기다림을 함께하는 사람입니다.","뚜껑 누르다 졸아서 라면이 10분 동안 불어 버림","기다림에도 알람을 맞추세요."],
 ["떡집 가래떡","🍡",1,"뽑자마자 김이 모락모락 나던 가래떡. 시작하는 일에 열정이 넘칩니다.","너무 길게 뽑혀서 떡집 밖 골목까지 나가 버림","시작만큼 끝도 정해 두세요."],
 ["시골 할머니 감자","🥔",1,"어떻게 요리해도 맛있던 감자. 어디서든 쓸모 있는 사람입니다.","창고 구석에서 기다리다 싹이 나서 감자밭을 새로 만듦","기다리는 동안 조금씩 움직여 보세요."],
 ["가을 햅쌀","🌾",2,"그해 가장 먼저 수확된 햅쌀. 좋은 시작을 알리는 사람입니다.","첫 밥 짓는 날 물을 너무 많이 넣어 죽이 됨","첫 마음일수록 기본에 충실하게."],
 ["시장 떡볶이 할머니","🌶️",2,"40년 동안 같은 맛을 지킨 떡볶이 할머니. 한결같음이 무기입니다.","레시피를 너무 꽁꽁 숨겨서 자식들도 모름","좋은 건 물려주세요."],
 ["밤 11시 야식 족발","🐷",1,"밤 열한 시만 되면 생각나던 족발. 사람들의 마음을 흔드는 유혹의 아이콘입니다.","새벽마다 사람들을 불러내 다이어트를 무너뜨림","유혹도 적당히."],
 ["단팥죽 속 새알심","⚪",1,"뜨거운 팥죽 속에 숨어 있던 새알심. 찾는 재미를 주는 사람입니다.","너무 꼭꼭 숨어서 그릇을 다 비울 때까지 아무도 못 찾음","가끔은 먼저 나타나세요."],
 ["생일 케이크 위 촛불","🕯️",2,"소원을 담아 꺼지던 촛불. 누군가의 특별한 순간을 함께하는 사람입니다.","후 불었는데 안 꺼지고 버티다가 케이크를 다 녹임","끝낼 땐 깔끔하게."],
 ["카페 와플 기계","🧇",1,"바삭한 격자무늬를 찍어 내던 와플 기계. 틀을 만드는 꼼꼼함이 있습니다.","손님 손등에도 와플 무늬를 찍어 버림","꼼꼼함은 대상을 가려서."],
 ["시골 장터 순대","🌭",1,"속을 꽉 채워 모두를 든든하게 하던 순대. 속이 꽉 찬 사람입니다.","너무 꽉 채우다 옆구리가 터져 버림","여유 공간도 필요해요."],
 ["최고급 한우 마블링","🥩",3,"눈꽃처럼 고운 무늬로 모두를 감탄시킨 한우. 귀하고 특별한 사람입니다.","너무 아까워서 냉장고에 모셔 두다 유통기한이 지남","좋은 건 아끼지 말고 즐기세요."],
 ["방금 지은 가마솥 밥","🍚",2,"뚜껑을 여는 순간 온 집안을 고소하게 만든 밥. 기본이 탄탄한 사람입니다.","뜸 들이다 너무 오래 기다려서 다 같이 굶음","뜸도 적당히 들이세요."],
 ["떡국 위 계란 지단","🥚",1,"노란색 하얀색으로 떡국을 예쁘게 만든 지단. 꾸미는 감각이 있는 사람입니다.","너무 예쁘게 채 썰다 손님들이 다 먹고 간 뒤에 완성됨","완벽보다 타이밍."],
 ["마라탕 속 분모자","🍜",1,"쫀득한 식감으로 마라탕 마니아를 사로잡은 분모자. 개성 강한 사람입니다.","너무 쫀득해서 먹는 사람 턱을 이틀 동안 아프게 함","개성도 상대가 감당할 만큼."],
 ["영화관 팝콘 기계","🍿",1,"톡톡 터지는 소리로 영화관을 설레게 한 팝콘 기계. 분위기를 띄우는 사람입니다.","너무 신나서 뚜껑 열린 채로 터뜨려 매표소까지 팝콘이 날아감","신날수록 뚜껑을 닫으세요."],
 ["카페의 아침 첫 에스프레소","☕",2,"아침마다 바리스타의 하루를 깨우던 첫 잔. 남을 깨우는 에너지가 있습니다.","너무 진하게 내려서 손님이 사흘 동안 잠을 못 잠","에너지도 적당히 나눠 주세요."],
 ["할머니 보리차 주전자","🫖",1,"사계절 내내 냉장고를 지키던 보리차. 언제나 곁에 있는 편안한 사람입니다.","너무 오래 끓이다 주전자 바닥을 태워 먹음","편안함도 가끔은 새로 끓이세요."],
 ["겨울 동치미 국물","🥣",2,"고구마 먹다 목 막힐 때 구원해 주던 동치미. 위기의 순간에 나타나는 해결사입니다.","너무 시원해서 사람들이 고구마는 안 먹고 동치미만 마심","도와주는 역할도 선을 지켜요."],
 ["방앗간 인절미","🍡",2,"고소한 콩고물로 모두를 행복하게 한 인절미. 은근히 정 많은 사람입니다.","콩고물을 너무 묻혀서 먹는 사람마다 재채기를 함","정도 적당히 묻혀 주세요."],
 ["잼 바른 토스트","🍞",1,"아침마다 바삭하게 하루를 열던 토스트. 시작을 든든하게 하는 사람입니다.","떨어질 때마다 꼭 잼 바른 면으로 떨어짐","중요한 면은 위로 두세요."],
 ["비빔밥 위 계란 프라이","🍳",1,"모든 재료를 하나로 비벼 주던 계란. 사람 사이를 잘 섞는 사람입니다.","노른자가 먼저 터져서 그릇 밖으로 탈출함","섞이기 전에 그릇 안에 있어 주세요."],
 ["눈썰매장 어묵 국물","🍢",1,"추위에 언 몸을 녹여 주던 어묵 국물. 위로가 필요한 순간에 나타나는 사람입니다.","너무 뜨거워서 받자마자 손님 혀를 데움","위로도 적당한 온도로."],
 ["임금님 수라상 신선로","🍲",3,"온갖 귀한 재료를 품고 끓던 신선로. 품격과 내공을 모두 갖췄습니다.","재료를 너무 많이 넣어서 임금님 앞에서 국물이 넘침","좋은 것도 다 넣지는 마세요."],
 ["서비스 군만두","🥟",1,"겉은 바삭 속은 촉촉하던 군만두. 반전의 매력이 있는 사람입니다.","평생 서비스로만 나오다 정식 메뉴 오디션을 포기함","나도 메인이 될 수 있어요."],
 ["설탕 듬뿍 꽈배기","🥨",1,"꼬여 있어도 맛있던 꽈배기. 꼬인 상황도 맛있게 만드는 사람입니다.","너무 꼬여서 자기가 어디서 시작했는지 잊음","가끔은 처음으로 돌아가 보세요."],
 ["추석 송편","🥟",2,"솔잎 향을 품고 쪄지던 송편. 예쁘게 빚으면 예쁜 짝을 만난다는 바로 그 떡입니다.","너무 예쁘게 빚어져서 아무도 아까워서 못 먹음","가끔은 망가져도 괜찮아요."],
 ["오이냉국 속 얼음","🧊",1,"한여름 국그릇을 시원하게 지켜 준 얼음. 열기를 식혀 주는 사람입니다.","너무 시원하게 하려다 국을 통째로 얼려 버림","식혀 주는 것도 적당히."],
 ["삼계탕 속 대추","🔴",1,"뚝배기 속에서 조용히 영양을 더하던 대추. 티 안 나게 돕는 사람입니다.","끝까지 몸에 좋은 일 해 놓고 결국 건져져서 버려짐","이번 생엔 공을 알아봐 주는 곳으로 가세요."],
 ["피자 치즈 크러스트","🍕",2,"끝까지 반전이 숨어 있던 치즈 크러스트. 마지막까지 기대하게 만드는 사람입니다.","너무 늦게 반전을 보여 줘서 다들 배불러 남김","좋은 건 조금 일찍 보여 주세요."],
 ["아이스크림 콘의 마지막 끝","🍦",1,"끝까지 초콜릿이 들어 있던 콘 끝부분. 마지막 선물을 준비하는 사람입니다.","밑에 구멍이 나서 녹은 아이스크림이 바닥으로 다 샘","마무리 구멍을 막아 두세요."],
 ["김장 날 보쌈 수육","🥓",2,"김장 노동을 한 번에 보상해 주던 수육. 고생 끝에 나타나는 행복입니다.","김장보다 먼저 삶아져서 다들 수육만 먹고 김장을 안 함","보상은 일 끝나고!"],
 /* ---- 물건 ---- */

 ["엘리베이터 닫힘 버튼","🛗",1,"모두가 급할 때 누르던 닫힘 버튼. 사람들의 조급함을 받아 주는 존재입니다.","너무 빨리 닫혀서 사장님을 밖에 두고 올라감","서두를수록 주변을 보세요."],
 ["교실 칠판지우개","🧽",1,"수업이 끝날 때마다 모든 걸 깨끗하게 지워 준 지우개. 새 출발을 돕는 사람입니다.","창밖에서 털다가 교감 선생님 머리에 분필 가루를 쏟음","털 때는 아래를 보세요."],
 ["머리맡 알람 시계","⏰",1,"매일 아침 사람들을 깨운 알람 시계. 책임감 하나는 확실합니다.","일요일에도 눈치 없이 새벽 여섯 시에 울림","쉬는 날도 기억해 주세요."],
 ["거실 TV 리모컨","📺",1,"소파 위에서 가족의 채널 결정권을 쥐고 있던 리모컨. 은근한 권력자입니다.","소파 틈으로 사라져 가족 전체를 일주일간 싸우게 함","중요한 건 눈에 띄는 곳에."],
 ["노래방 탬버린","🎉",1,"분위기가 처질 때마다 흥을 살려 준 탬버린. 모임의 분위기 메이커입니다.","발라드 부를 때도 눈치 없이 흔들어 댐","분위기는 읽고 흔드세요."],
 ["수학여행 버스 맨 뒷자리","🚌",1,"수학여행 때마다 가장 인기 있던 맨 뒷자리. 사람들이 모이는 핫플레이스입니다.","너무 신나게 놀다 휴게소에 반 친구를 두고 출발함","놀 땐 인원 체크를 하세요."],
 ["학교 종","🔔",2,"'땡땡땡' 소리로 모두를 모이게 한 학교 종. 시작을 알리는 사람입니다.","쉬는 시간 종 대신 수업 시작 종만 울려서 학생들의 원성을 삼","좋은 소식도 알려 주세요."],
 ["자판기 속 마지막 캔커피","🥫",1,"모두가 원했던 마지막 한 캔. 귀하게 대접받는 사람입니다.","동전만 먹고 나오지 않아서 손님들에게 발로 차임","받은 만큼은 돌려주세요."],
 ["목욕탕 냉탕","🧊",2,"아무나 못 들어가던 냉탕. 용기 있는 사람만 알아보는 매력이 있습니다.","아무도 안 들어와서 혼자 수영장 놀이를 함","문턱을 조금만 낮춰 보세요."],
 ["삐걱대는 오래된 자전거","🚲",1,"삐걱거려도 멈추지 않던 자전거. 꾸준히 굴러가는 사람입니다.","브레이크가 잘 안 들어서 내리막길에서 이웃 마을까지 감","멈추는 법도 연습하세요."],
 ["빨간 고무장갑","🧤",1,"모든 궂은일을 도맡은 고무장갑. 손에 물 마를 날 없는 성실함의 아이콘입니다.","한 짝만 잃어버려서 평생 짝을 찾아 헤맴","짝은 꼭 붙어 다니세요."],
 ["할머니 꽃무늬 몸빼","👖",2,"편안함과 화려함을 모두 잡은 몸빼 바지. 실용과 멋을 아는 사람입니다.","너무 편해서 결혼식장에도 입고 감","편안함도 장소를 보세요."],
 ["필통 속 몽당연필","✏️",1,"닳고 닳을 때까지 쓰인 몽당연필. 끝까지 자기 몫을 하는 사람입니다.","너무 짧아져서 깍지 낀 채 시험지 위에 누워 버림","쓰임이 다하면 쉬어도 돼요."],
 ["시험 전날 밤 형광펜","🖍️",1,"교과서 전체를 알록달록하게 만든 형광펜. 의욕이 넘치는 사람입니다.","모든 줄에 다 칠해서 뭐가 중요한지 아무도 모름","중요한 것만 골라 빛내세요."],
 ["동네 슈퍼 앞 평상","🪑",1,"동네 어르신들의 수다를 다 들어 준 평상. 모두의 쉼터가 되는 사람입니다.","수다가 너무 길어 해가 지고 모기가 다 몰려옴","쉬는 것도 시간을 정해 두세요."],
 ["거실 가족사진 액자","🖼️",2,"거실 한가운데서 가족의 시간을 지켜 온 액자. 추억을 소중히 여기는 사람입니다.","삐뚤어진 채 10년 동안 걸려 있어서 온 가족 목이 기울어짐","작은 삐뚤어짐은 바로바로 고치세요."],
 ["겨울밤 전기장판","🛌",1,"겨울밤 이불 속을 천국으로 만든 전기장판. 곁에 있으면 따뜻해지는 사람입니다.","너무 따뜻하게 해서 주인이 아침에 출근을 안 함","따뜻함에도 알람이 필요해요."],
 ["세탁기 속 사라진 양말 한 짝","🧦",1,"늘 한 짝씩 사라지던 양말. 미스터리한 매력의 소유자입니다.","세탁기 뒤로 숨었다가 3년 뒤 이사할 때 발견됨","숨는 것도 적당히."],
 ["시골 정류장 버스 시간표","🚏",1,"하루 세 번뿐인 버스 시간을 알려 준 시간표. 정확한 사람입니다.","비에 젖어 숫자가 번지는 바람에 마을 사람들이 반나절을 기다림","중요한 정보는 백업하세요."],
 ["오락실 동전 교환기","🪙",1,"아이들의 꿈을 동전으로 바꿔 준 교환기. 기회를 나눠 주는 사람입니다.","고장 나서 천 원 넣으면 동전을 스무 개씩 줌","너그러움도 계산은 맞게."],
 ["졸업식 꽃다발","💐",2,"새로운 시작을 축하하던 꽃다발. 사람들의 기쁜 날에 함께하는 존재입니다.","사진 찍을 때마다 졸업생 얼굴을 가려 버림","축하할 땐 주인공을 돋보이게."],

 ["캠핑장 텐트","⛺",1,"어디서든 하룻밤 집이 되어 준 텐트. 적응력이 뛰어난 사람입니다.","바람 불던 밤 혼자 날아가서 옆 캠핑장에 착지함","단단히 고정할 곳을 정해 두세요."],

 ["시험지 마지막 문제","📝",2,"아무도 쉽게 풀지 못했던 마지막 문제. 쉽게 파악되지 않는 신비로운 사람입니다.","너무 어렵게 나와서 출제한 선생님도 답을 잊음","가끔은 힌트를 주세요."],
 ["동네 빵집 소보로빵","🍞",1,"부스러기를 흘리며 먹어도 맛있던 소보로빵. 털털한 매력의 소유자입니다.","가는 곳마다 부스러기를 남겨 주인이 어디 갔는지 다 들킴","흔적 관리도 조금은 하세요."],
 ["골목길 눈사람","⛄",1,"아이들이 정성껏 만든 눈사람. 짧게 있어도 사람들을 행복하게 했습니다.","햇볕 쬐고 싶어서 양지바른 곳으로 걸어가다 녹아 버림","좋아하는 것도 내 몸 상태를 봐 가며."],
 ["유리창 위 성에꽃","❄️",1,"한겨울 아침 유리창에 그림을 그려 놓던 성에. 일상에 예술을 더하는 사람입니다.","너무 빽빽하게 그려서 아무도 창밖을 볼 수 없었음","가끔은 바깥 풍경도 보여 주세요."],
 ["도서관 맨 구석 책","📚",2,"아무도 찾지 않았지만 한 사람의 인생을 바꾼 책. 알아보는 사람에게만 보이는 보석입니다.","너무 구석에 꽂혀 있어서 50년 동안 딱 한 번 빌려짐","가끔은 앞줄로 나와 보세요."],
 ["골목길 가로등","💡",2,"늦은 밤 귀갓길을 지켜 주던 가로등. 누군가의 안심이 되는 사람입니다.","밤새 깜빡깜빡해서 동네 사람들이 공포 영화 찍는 줄 앎","불안할 땐 솔직하게 말하세요."],
 ["택배 상자 속 뽁뽁이","🫧",1,"소중한 물건을 지켜 준 뽁뽁이. 남을 보호하는 사람입니다.","받은 사람이 하루 종일 터뜨리느라 물건은 꺼내 보지도 않음","주인공은 안에 있어요."],
 ["어린이날 풍선","🎈",1,"아이 손목에 묶여 하루 종일 웃음을 준 풍선. 가볍고 밝은 사람입니다.","손목 끈이 풀리자 신나서 구름까지 날아가 버림","자유도 좋지만 돌아올 곳은 챙기세요."],

 ["바닷가 모래성","🏰",1,"아이들의 상상력으로 지어진 모래성. 꿈을 짓는 사람입니다.","밀물 시간을 모르고 해변 맨 앞에 지어짐","꿈도 자리를 잘 잡아야 오래가요."],

 ["비디오 가게 테이프","📼",2,"주말마다 가족을 한자리에 모이게 한 비디오테이프. 추억을 만드는 사람입니다.","되감기 안 된 채 반납되어 다음 손님이 결말부터 봄","끝낸 일은 처음으로 되돌려 두세요."],

 ["마을회관 확성기","📢",1,"마을 소식을 온 동네에 알리던 확성기. 목소리가 큰 사람입니다.","잃어버린 송아지 대신 이장님 비밀 연애를 방송해 버림","마이크 켜진 건 꼭 확인하세요."],

 ["운동회 계주 바통","🏃",2,"반 전체의 희망을 이어받던 바통. 사람과 사람을 잇는 존재입니다.","마지막 주자 손에서 미끄러져 관중석으로 날아감","끝까지 꽉 잡아 주세요."],
 ["산사의 목탁","🪵",2,"규칙적인 소리로 마음을 고요하게 만든 목탁. 리듬감과 평정심을 가진 사람입니다.","새벽 예불 때 템포를 너무 올려 스님들이 랩을 함","마음이 급해도 박자는 천천히."],
 ["세종 시대 해시계 앙부일구","☀️",3,"그림자로 시간을 알려 준 조선의 해시계. 원리를 꿰뚫는 사람입니다.","비 오는 날엔 아무것도 몰라서 백성들이 하루 종일 기다림","대비책 하나쯤은 준비하세요."],
 ["조선의 측우기","🌧️",3,"비의 양을 정확히 재던 조선의 측우기. 꼼꼼하게 기록하는 사람입니다.","비가 너무 와서 넘치는 바람에 그해 기록이 '많이'로 남음","그릇을 키울 줄도 알아야 해요."],
 ["훈민정음 해례본 한 장","📜",3,"백성을 위한 글자의 비밀을 담은 한 장. 지식을 나누는 사람입니다.","책 사이에 너무 깊이 꽂혀 수백 년 동안 아무도 못 찾음","좋은 지식은 꺼내서 나누세요."],

 ["신라 화랑","🌸",3,"산천을 누비며 몸과 마음을 닦던 화랑. 멋과 실력을 모두 갖춘 사람입니다.","외모 관리에 너무 집중하다 수련 시간에 늦음","거울보다 수련이 먼저."],

 ["열 번 낙방한 선비","📜",1,"열 번 떨어져도 다시 붓을 든 선비. 포기하지 않는 끈기의 소유자입니다.","합격자 명단을 거꾸로 읽어서 자기가 붙은 걸 모름","결과는 두 번 확인하세요."],

 ["궁궐 일정 담당 내시","🏯",2,"궁의 모든 일정과 비밀을 관리하던 내시. 꼼꼼하고 입이 무거운 사람입니다.","임금님 일정을 너무 빡빡하게 짜서 임금님이 가출함","쉬는 시간도 일정이에요."],

 ["중세 연금술사","⚗️",2,"납을 금으로 바꾸겠다며 밤새 실험한 연금술사. 호기심과 집념이 대단합니다.","금 대신 엄청난 냄새를 만들어 온 마을이 이사 감","실험은 환기 잘 되는 곳에서."],

 ["베르사유 궁전 제빵사","🥐",2,"매일 아침 궁전에 크루아상을 굽던 제빵사. 손맛으로 사람을 사로잡습니다.","버터를 너무 넣어서 왕비 드레스가 안 맞게 됨","좋은 것도 적당량."],

 ["몽골 초원 매사냥꾼","🦅",2,"매와 함께 초원을 누빈 사냥꾼. 동료와의 믿음이 깊은 사람입니다.","매를 너무 아껴서 사냥 대신 매 목욕만 시킴","아끼는 것과 함께 일하는 건 달라요."],
 ["1980년대 음악다방 DJ","🎧",2,"신청곡과 사연으로 다방을 가득 채운 DJ. 감성을 나누는 사람입니다.","사연을 너무 감성적으로 읽어서 손님들 커피가 다 식음","감성도 적당한 온도로."],
 ["옛날 극장 간판 화가","🎨",2,"배우 얼굴을 거대한 간판에 그리던 화가. 크게 보는 눈이 있습니다.","주연 배우 얼굴을 조연이랑 바꿔 그려 극장에 항의가 빗발침","이름표는 확인하세요."],
 ["시골 우체부 아저씨","📬",1,"자전거로 산 넘어 편지를 전하던 우체부. 사람 사이 소식을 잇는 사람입니다.","집집마다 차를 얻어 마시다 해 질 녘에야 배달이 끝남","정도 좋지만 일정도 챙기세요."],
 ["동네 이발소 사장님","💈",2,"동네 남자들의 머리를 30년 동안 책임진 이발사. 믿음을 주는 사람입니다.","수다 떨다가 손님 앞머리를 일자로 싹둑 자름","손이 바쁠 땐 입은 쉬게."],
 ["연탄 배달 아저씨","⚫",1,"추운 겨울 골목마다 연탄을 날라 온기를 전한 배달부. 묵묵히 따뜻함을 나르는 사람입니다.","연탄 들고 계단 오르다 얼굴이 새까매져서 손님이 못 알아봄","가끔은 거울도 보세요."],
 ["달동네 구멍가게 사장","🏪",1,"늦은 밤에도 불을 켜 두던 동네 구멍가게. 정 많은 사람입니다.","라면 한 봉지 팔면서 수다를 세 시간 떨어 가게 문을 못 닫음","정은 나누되 퇴근 시간은 지키세요."],
 ["유랑극단 마술사","🎩",2,"모자에서 비둘기를 꺼내던 마술사. 사람들을 놀라게 하는 재주가 있습니다.","비둘기 대신 점심으로 먹으려던 닭다리를 꺼냄","소품은 따로 보관하세요."],
 ["해적선 요리사","🍳",2,"흔들리는 배 위에서도 맛있는 밥을 짓던 요리사. 어떤 상황에서도 사람을 먹여 살립니다.","보물 지도를 냄비 받침으로 써서 지도가 국물에 다 번짐","중요한 종이는 부엌에서 멀리."],
 ["나루터 뱃사공","🚣",1,"강을 오가며 사람들을 건네주던 뱃사공. 누군가의 다리가 되는 사람입니다.","손님과 수다 떨다 건너편 대신 출발한 곳으로 다시 돌아옴","대화도 좋지만 목적지는 기억하세요."],
 /* ---- 옛이야기 ---- */
 ["연못 속 산신령","🧙",3,"'이 도끼가 네 도끼냐' 하며 정직한 사람을 시험한 산신령. 사람 보는 눈이 남다릅니다.","금도끼 은도끼를 너무 많이 나눠 줘서 연못 바닥이 텅 빔","너그러움도 예산 안에서."],
 ["선녀의 날개옷","👘",3,"하늘과 땅을 오가게 해 준 날개옷. 자유를 상징하는 사람입니다.","빨래터에 벗어 두었다가 나무꾼에게 숨겨짐","소중한 건 눈에 보이는 곳에 두세요."],
 ["흥부네 박씨","🌱",3,"제비가 물어다 준 행운의 박씨. 착한 사람에게 복을 가져다주는 존재입니다.","실수로 놀부네 마당에 먼저 떨어질 뻔함","행운도 주소는 정확하게."],
 ["별주부전 꾀 많은 토끼","🐰",2,"용궁에서 간을 놓고 왔다는 꾀로 살아 돌아온 토끼. 위기의 순간 기지가 빛납니다.","살아 돌아와서 너무 자랑하다 자라에게 또 잡혀감","위기 넘긴 뒤엔 조용히."],
 ["해님 달님의 동아줄","🪢",3,"하늘에서 내려와 오누이를 구한 동아줄. 결정적 순간에 손을 내미는 사람입니다.","내려가다 길을 잘못 들어 호랑이 앞에 먼저 떨어질 뻔함","도움도 방향을 확인하고."],
 ["오작교를 놓은 까치","🐦",3,"일 년에 한 번 다리가 되어 견우와 직녀를 이어 준 까치. 인연을 맺어 주는 사람입니다.","다리가 되어 주다 간지러워서 웃음을 참지 못해 다리가 흔들림","중요한 순간엔 꾹 참아 주세요."],
 ["콩쥐를 도운 두꺼비","🐸",2,"밑 빠진 독을 몸으로 막아 준 두꺼비. 남의 어려움을 몸으로 돕는 사람입니다.","너무 꽉 막아서 독에서 다시 나오지 못함","도와준 뒤엔 나도 빠져나오세요."],
 ["떡 하나 주면 안 잡아먹지 호랑이","🐯",1,"고갯길에서 떡을 받아 먹던 호랑이. 먹는 것 앞에서 솔직한 사람입니다.","떡 받아먹는 데 정신 팔려 결국 할머니를 놓침","목표를 잊지 마세요."],
 ["토끼와 거북이 경주 심판","🏁",2,"공정하게 경주를 지켜본 심판. 끝까지 지켜보는 끈기의 소유자입니다.","토끼 따라 같이 낮잠 자다 결승선을 못 봄","판단하는 사람은 깨어 있어야 해요."],
 ["피노키오의 코","🤥",1,"거짓말을 하면 쑥쑥 자라던 코. 솔직함을 숨기지 못하는 사람입니다.","'나 지금 거짓말하는 중'이라고 말해서 코가 고장 남","복잡하게 생각하지 마세요."],
 ["신데렐라의 유리구두","👠",3,"주인을 찾아 왕국을 누빈 유리구두. 운명을 이어 주는 사람입니다.","계단에서 벗겨지면서 하필 왕자 발등에 떨어짐","운명적인 만남도 살살 하세요."],
 ["하늘을 나는 양탄자","🧞",3,"하늘을 날아 어디든 데려다준 양탄자. 사람의 꿈을 태워 주는 존재입니다.","너무 빨리 날아서 공주님 머리를 다 헝클어뜨림","속도보다 승객의 기분을."],
 ["일곱 난쟁이의 막내","⛏️",2,"형들을 따라 광산에서 일하던 막내. 귀여움과 성실함을 모두 갖췄습니다.","수상한 사과를 깎다가 자기가 먼저 한 입 먹을 뻔함","의심 가는 건 먼저 먹지 마세요."],
 /* ---- 현대 직업 ---- */
 ["고궁 수문장","💂",2,"몇 시간이고 미동도 없이 문을 지키던 수문장. 집중력이 대단한 사람입니다.","관광객이 사진 찍자고 해서 몰래 브이를 함","티 안 나게 웃는 법을 익히세요."],
 ["유명 셰프의 보조 요리사","🔪",1,"셰프 뒤에서 모든 재료를 준비하던 보조. 조용한 실력자입니다.","양파를 너무 많이 썰어 주방 전체가 눈물바다가 됨","준비도 필요한 만큼만."],
 ["금메달 양궁 선수","🎯",3,"바람을 읽고 10점을 꿰뚫던 양궁 선수. 흔들림 없는 집중력의 소유자입니다.","시상식 때 너무 기뻐 메달을 깨물다 이가 흔들림","기쁨은 부드럽게."],
 ["동네 축구 골키퍼","🥅",1,"모두가 꺼리던 자리를 기꺼이 맡던 골키퍼. 책임감 있는 사람입니다.","공 막다가 나비 따라가서 빈 골대로 골을 먹음","집중은 경기 끝까지."],
 ["영화 엑스트라 3번","🎞️",1,"화면 구석에서 열심히 걸어 다닌 엑스트라. 작은 역할도 진심인 사람입니다.","너무 열심히 연기해서 주인공보다 눈에 띄어 편집당함","조연일 땐 조연답게. 주연의 날도 올 거예요."],
 ["트로트 가수 백댄서","💃",1,"화려한 조명 아래 무대를 빛낸 백댄서. 흥이 넘치는 사람입니다.","가수보다 앞에 나가서 춤추다 마이크 줄에 걸림","내 자리를 기억하세요."],
 ["새벽 연습실 아이돌 연습생","🎤",2,"새벽까지 연습실 불을 밝힌 연습생. 꿈을 향해 달리는 사람입니다.","데뷔 무대에서 너무 긴장해 다른 그룹 노래를 부름","연습한 만큼 나를 믿으세요."],
 ["산골 마을 의사 선생님","🩺",3,"산골 마을의 모든 아픔을 돌본 의사. 사람을 살리는 따뜻한 손을 가졌습니다.","왕진 다니다 너무 많은 감자를 받아 집이 감자 창고가 됨","받는 정도 적당히."],
 /* ---- 자연 ---- */

 ["한가위 보름달","🌕",3,"모두의 소원을 들어 주던 한가위 보름달. 사람들의 마음을 환하게 비추는 사람입니다.","소원이 너무 많이 몰려서 다 대충 듣고 넘김","모든 걸 다 들어줄 필요는 없어요."],
 ["메마른 땅의 봄비","🌧️",2,"메마른 땅을 촉촉하게 적신 봄비. 새로운 시작을 돕는 사람입니다.","하필 벚꽃 축제 첫날에 내려서 꽃잎을 다 떨어뜨림","남의 축제 날짜도 한 번 확인하세요."],
 ["한여름 소나기","⛈️",1,"더위를 한 방에 날려 준 소나기. 시원시원한 성격의 소유자입니다.","빨래 널자마자 내리고 걷자마자 그침","눈치 게임은 이제 그만."],
 ["가을 하늘 뭉게구름","☁️",1,"하늘에 온갖 모양을 그리던 뭉게구름. 상상력이 풍부한 사람입니다.","강아지 모양을 만들다 바람에 밀려 공룡이 됨","흐름에 맡겨도 의외로 괜찮아요."],
 ["처마 끝 고드름","🧊",1,"처마 끝에 반짝이며 매달린 고드름. 차가워 보여도 아름다운 사람입니다.","녹으면서 하필 지나가던 사람 목덜미에 물을 떨어뜨림","떠날 때도 깔끔하게."],
 ["제주 한라봉","🍊",2,"꼭지가 볼록 튀어나와 더 사랑받은 한라봉. 개성이 매력이 되는 사람입니다.","꼭지가 너무 자랑스러워 택배 상자를 뚫고 나옴","자랑도 상자 안에서."],
 ["벚꽃길 첫 꽃잎","🌸",2,"봄이 왔다고 가장 먼저 알린 꽃잎. 새로운 계절을 여는 사람입니다.","너무 일찍 피어서 꽃샘추위에 덜덜 떨며 혼자 버팀","빠른 것보다 알맞은 때."],
 ["해만 보는 해바라기","🌻",1,"하루 종일 해만 바라보던 해바라기. 한결같은 사람입니다.","해만 보다가 목이 굳어 저녁에 고개를 못 돌림","가끔은 다른 쪽도 보세요."],
 ["풀밭의 네잎클로버","🍀",3,"수많은 세잎클로버 사이에 숨어 있던 행운. 쉽게 찾을 수 없는 귀한 사람입니다.","너무 꼭꼭 숨어서 찾던 아이가 울면서 집에 감","가끔은 먼저 손을 흔들어 주세요."],
 ["진흙 속 연꽃","🪷",3,"진흙 속에서도 맑게 피어난 연꽃. 어떤 환경에서도 빛나는 사람입니다.","우아하게 떠 있느라 잉어가 밑에서 줄기를 갉아먹는 걸 모름","겉이 평온할수록 밑도 살피세요."],
 ["시골 마을 은행나무","🍂",2,"가을마다 마을을 노랗게 물들인 은행나무. 존재만으로 계절을 알립니다.","열매 냄새 때문에 사람들이 코를 막고 지나감","향기 관리도 매력의 일부예요."],
 ["산꼭대기 바위","🪨",1,"수천 년 동안 산 정상을 지킨 바위. 흔들리지 않는 사람입니다.","등산객들이 쌓은 돌탑을 지탱하다 지쳐서 살짝 기울어짐","버티기 힘들 땐 말하세요."],
 ["계곡의 조약돌","🪨",1,"물살에 깎이며 동글동글해진 조약돌. 시간이 지날수록 둥글어지는 사람입니다.","물수제비 돌로 뽑혀 강 건너편 풀숲까지 날아가 버림","좋은 기회도 착지 지점을 보세요."],
 ["잠든 화산","🌋",3,"속에 뜨거운 불을 품고 있던 화산. 겉은 조용해도 열정이 끓어오르는 사람입니다.","참고 참다가 한 번에 터져서 섬을 하나 새로 만듦","조금씩 표현하는 게 건강해요."],
 ["북극 밤하늘 오로라","🌌",3,"극지방 밤하늘을 춤추게 한 오로라. 보는 사람을 넋 놓게 만드는 사람입니다.","너무 수줍어서 관광객이 오면 사라졌다가 가면 나타남","보여 줄 땐 용기 있게."],
 ["사막의 신기루","🏜️",2,"목마른 여행자에게 오아시스를 보여 준 신기루. 희망을 보여 주는 사람입니다.","오아시스 대신 아이스크림 가게를 보여 줘서 여행자를 더 괴롭게 함","희망도 현실적으로."],

const ERAS=["삼국시대 신라","고려 말기","조선 영조 시절","석기시대","로마제국 전성기","고대 이집트","대항해시대","백제 사비 시절","1970년대 서울","빙하기 끝 무렵","송나라 개봉","잉카제국 고원"];

const LUCKS=["노란 손수건","동전 지갑","나무 젓가락","초록색 펜","작은 화분","귤 한 개","손거울","오래된 열쇠","파란 머그컵","손뜨개 목도리"];

function h(str,seed){let x=2166136261^seed;for(const c of str){x^=c.codePointAt(0);x=Math.imul(x,16777619)}return x>>>0}
function pick(a,k,s){return a[h(k,s)%a.length]}
const $=id=>document.getElementById(id);
let cur=null;

function reading(name,birth){
  const key=name.trim()+"|"+birth;
  const roll=h(key,7)%100, tier=roll<8?3:roll<35?2:1;
  const pool=LIVES.filter(l=>l[2]===tier);
  const [life,glyph,,desc,mistake,lesson]=pick(pool,key,11);
  const [y,m,d]=birth.split("-");
  return {key,name:name.trim(),birthText:`${y}년 ${+m}월 ${+d}일생`,life,glyph,tier,desc,mistake,lesson,
    era:pick(ERAS,key,23),place:pick(PLACES,key,37),trace:pick(TRACES,key,53),luck:pick(LUCKS,key,61),
    no:String(h(key,97)%100000).padStart(5,"0")};
}

/* ---------- 카드 이미지 그리기 (1080×1350, 인스타 세로 비율) ---------- */
function wrapLines(ctx,text,maxW){
  const out=[];let line="";
  for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch}else line=t}
  if(line)out.push(line);return out;
}
async function drawCard(r,showMistake){
  try{await document.fonts.load('700 60px "Gowun Batang"');await document.fonts.load('500 30px "IBM Plex Sans KR"')}catch(_){}
  const cv=$("cv"),c=cv.getContext("2d"),W=1080,H=1350,TOP=770;
  const SER='"Gowun Batang", serif', SANS='"IBM Plex Sans KR", sans-serif';
  const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const theme={1:["#3b3129","#5a4a3d","#e9dcc6"],2:["#163c55","#2f6b8a","#cfe6f2"],3:["#3a1640","#7a3484","#f4d98c"]}[r.tier];
  // 윗부분: 등급 색 배경
  const g=c.createLinearGradient(0,0,0,TOP);g.addColorStop(0,theme[0]);g.addColorStop(1,theme[1]);
  c.fillStyle=g;c.fillRect(0,0,W,TOP);
  // 빛 번짐 + 별가루
  const rg=c.createRadialGradient(W/2,360,20,W/2,360,330);rg.addColorStop(0,"rgba(255,240,200,.45)");rg.addColorStop(1,"rgba(255,240,200,0)");
  c.fillStyle=rg;c.fillRect(0,0,W,TOP);
  for(let i=0;i<(r.tier===3?140:60);i++){const x=h(r.key+i,3)%W,y=h(r.key+i,5)%TOP,s=1+(i%3);c.fillStyle=`rgba(255,245,215,${.2+(i%5)/10})`;c.fillRect(x,y,s,s)}
  // 아랫부분: 한지
  c.fillStyle="#f6efe2";c.fillRect(0,TOP,W,H-TOP);
  for(let i=0;i<500;i++){const x=h(r.key+i,9)%W,y=TOP+h(r.key+i,13)%(H-TOP);c.fillStyle="rgba(120,95,60,.05)";c.fillRect(x,y,2+(i%3),1)}
  c.textAlign="center";
  c.fillStyle=theme[2];c.font=`600 26px ${SANS}`;c.fillText(`前生鑑定書  ·  제 ${r.no} 호`,W/2,92);
  c.fillStyle="#fff";c.font=`400 38px ${SER}`;c.fillText(`${r.name} 님의 전생은`,W/2,170);
  c.font=`230px ${EMO}`;c.textBaseline="middle";c.fillText(r.glyph,W/2,370);c.textBaseline="alphabetic";
  // 등급 배지 (채움)
  const rl=(r.tier===3?"★ ":"")+RLABEL[r.tier]+" 전생";c.font=`700 30px ${SANS}`;const tw=c.measureText(rl).width+56;
  c.fillStyle=theme[2];c.beginPath();c.roundRect(W/2-tw/2,522,tw,54,27);c.fill();
  c.fillStyle=theme[0];c.fillText(rl,W/2,560);
  // 전생 이름
  c.fillStyle="#fff";let fs=82;c.font=`700 ${fs}px ${SER}`;let tl=wrapLines(c,r.life,W-150);
  if(tl.length>2){fs=66;c.font=`700 ${fs}px ${SER}`;tl=wrapLines(c,r.life,W-150)}
  const ty=tl.length===1?670:640;tl.slice(0,2).forEach((l,i)=>c.fillText(l,W/2,ty+i*(fs+14)));
  // 설명
  let y=TOP+74;c.fillStyle="#3d352e";c.font=`400 30px ${SANS}`;
  const dl=wrapLines(c,r.desc,W-200);dl.forEach((l,i)=>c.fillText(l,W/2,y+i*46));y+=dl.length*46+18;
  // 정보 3칸
  const cols=[["시대",r.era],["살던 곳",r.place],["행운의 물건",r.luck]],cw=(W-160)/3;
  cols.forEach(([k,v],i)=>{const cx=80+cw*i+cw/2;
    c.fillStyle="#9a8d7c";c.font=`500 24px ${SANS}`;c.fillText(k,cx,y+10);
    c.fillStyle="#2b2622";let vf=30;c.font=`600 ${vf}px ${SANS}`;while(c.measureText(v).width>cw-20&&vf>20){vf-=2;c.font=`600 ${vf}px ${SANS}`}
    c.fillText(v,cx,y+52);
    if(i)c.fillStyle="#d9cdb8",c.fillRect(80+cw*i,y-16,2,80);
  });
  y+=100;
  // 전생의 실수 박스
  const bx=80,bw=W-160,bh=H-60-y;
  c.fillStyle="rgba(184,50,42,.08)";c.beginPath();c.roundRect(bx,y,bw,bh,16);c.fill();
  c.strokeStyle="#b8322a";c.lineWidth=2.5;c.setLineDash([10,8]);c.beginPath();c.roundRect(bx,y,bw,bh,16);c.stroke();c.setLineDash([]);
  c.fillStyle="#b8322a";c.font=`700 24px ${SANS}`;c.fillText("전생에서 했던 실수",W/2,y+44);
  if(showMistake){
    c.fillStyle="#2b2622";let mf=34;c.font=`700 ${mf}px ${SER}`;let ml=wrapLines(c,r.mistake,bw-60);
    if(ml.length>2){mf=29;c.font=`700 ${mf}px ${SER}`;ml=wrapLines(c,r.mistake,bw-60)}
    ml.slice(0,2).forEach((l,i)=>c.fillText(l,W/2,y+94+i*(mf+12)));
  }else{
    c.fillStyle="#6f655b";c.font=`700 34px ${SER}`;c.fillText("🔒 봉인됨 · 전생 감정소에서 확인",W/2,y+100);
  }
  // 도장 (오른쪽 위 빈 공간 — 글자와 겹치지 않음)
  c.save();c.translate(W-130,140);c.rotate(-0.21);
  c.strokeStyle="rgba(255,236,230,.92)";c.lineWidth=6;c.beginPath();c.roundRect(-58,-58,116,116,12);c.stroke();
  c.fillStyle="rgba(255,236,230,.92)";c.font=`700 34px ${SER}`;c.fillText("前生",0,-6);c.fillText("確認",0,36);c.restore();
  c.fillStyle="#9a8d7c";c.font=`500 22px ${SANS}`;c.fillText("전생 감정소",W/2,H-24);
  return new Promise(res=>cv.toBlob(b=>res(b),"image/png"));
}

let AC=null,soundOn=true;
try{soundOn=localStorage.getItem("pl-sound")!=="off"}catch(_){}
function ac(){
  if(!soundOn)return null;
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f,t0,dur,{type="sine",vol=.2,f2=null}={}){
  const a=ac();if(!a)return;
  const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(t0,dur,{vol=.2,freq=400,q=1,type="lowpass"}={}){
  const a=ac();if(!a)return;
  const t=a.currentTime+t0,len=Math.ceil(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;fl.type=type;fl.frequency.value=freq;fl.Q.value=q;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+dur);
}
const SFX={
  start(){ // 감정 시작: 신비로운 상승 아르페지오 + 바람 소리 (로딩 시간과 맞춤)
    [392,494,587,740,880,988,1175].forEach((f,i)=>tone(f,i*.3,.9,{vol:.09}));
    noise(0,2.2,{vol:.05,freq:2500,type:"bandpass",q:.7});
  },
  reveal(tier){ // 결과 공개: 종소리 — 등급이 높을수록 화려하게
    const base=tier===3?523:tier===2?440:392;
    [1,2.01,3.02].forEach((m,i)=>tone(base*m,0,1.8-i*.4,{vol:.16/(i+1)}));
    if(tier>=2)[1047,1319,1568].forEach((f,i)=>tone(f*(tier===3?1.5:1),.15+i*.08,.6,{vol:.06}));
  },
  rumble(){ // 봉인 흔들림: 낮게 우르릉
    noise(0,1.65,{vol:.25,freq:180});tone(55,0,1.65,{type:"triangle",vol:.12,f2:90});
  },
  burst(){ // 봉인 해제: 쾅 + 반짝
    tone(140,0,.35,{vol:.35,f2:45});noise(0,.25,{vol:.2,freq:900});
    [1568,2093,2637].forEach((f,i)=>tone(f,.08+i*.07,.5,{vol:.05}));
  },
  tick(){tone(1800,0,.03,{type:"square",vol:.015})} // 글자 타이핑
};

/* 지금 보고 있는 감정서 카드를 카카오 서버에 올려 공유 메시지 이미지로 씀 (실패하면 기본 미리보기 이미지) */

  kakaoImg={key:k,url:null,p:null};

          imageUrl:img||OG_IMAGE,imageWidth:img?1080:1200,imageHeight:img?1350:630,link
        },
        buttons:[{title:"내 전생 보기",link}]
      });
      return;
    }catch(_){}
  }
  // 카카오 키가 없을 때: 휴대폰 공유창(카톡 포함)으로 카드 이미지와 문구를 함께 보냄
  try{
    const file=new File([cardBlob],`전생감정서_${cur.name}.png`,{type:"image/png"});
    const data={files:[file],text:shareText()+"\n"+SHARE_URL};
    if(navigator.canShare&&navigator.canShare(data)){await navigator.share(data);return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const t=shareText()+"\n"+SHARE_URL;
  try{await navigator.clipboard.writeText(t);toast("공유 문구를 복사했어요. 카톡 대화방에 붙여 넣어 주세요.")}
  catch(_){toast("복사가 안 되는 환경이에요. 카드 이미지를 저장해서 보내 주세요.")}
});

/* ---------- 게시판 + 댓글 (claude.ai 아티팩트에서만 공유 저장소 사용, 일반 웹에서는 숨김) ---------- */
let db=null,me=null,posts=[],cmts={},openIds=new Set();
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function renderFeed(){
  const ul=$("feed");ul.replaceChildren();
  $("count").textContent=posts.length?`${posts.length}명 감정 완료`:"";
  if(!db){ul.append(el("li","empty","게시판은 로그인한 상태에서만 볼 수 있어요."));return}
  if(!posts.length){ul.append(el("li","empty","아직 올라온 전생이 없어요. 위에서 감정받고 '게시판에 올리기'를 눌러 첫 번째가 되어 보세요."));return}
  for(const p of posts){
    const li=el("li","post");
    const top=el("div","post-top");top.append(el("div","pglyph",p.glyph));
    const meta=el("div","pmeta");meta.append(el("span","pname",p.name+" 님"),el("span","plife",p.life));
    const rb=el("span","rarity r-"+p.tier,RLABEL[p.tier]||"일반");meta.append(rb);
    top.append(meta);li.append(top);
    li.append(el("p","pmistake","전생의 실수: "+p.mistake));
    const list=cmts[p.id]||[];
    const tg=el("button","ctoggle",openIds.has(p.id)?"댓글 닫기":`댓글 ${list.length}개 · 댓글 달기`);tg.type="button";
    tg.onclick=()=>{openIds.has(p.id)?openIds.delete(p.id):openIds.add(p.id);renderFeed()};
    li.append(tg);
    if(openIds.has(p.id)){
      const box=el("div","comments");
      for(const c of list){const d=el("div","cmt");d.append(el("b",null,c.name),el("span",null,c.text));box.append(d)}
      const f=el("form","cform");
      const n=el("input");n.id="cn-"+p.id;n.placeholder="이름";n.maxLength=10;
      try{n.value=localStorage.getItem("pl-cname")||""}catch(_){}
      const t=el("input");t.id="ct-"+p.id;t.placeholder="댓글을 남겨 보세요";t.maxLength=120;
      const b=el("button",null,"등록");b.type="submit";
      f.append(n,t,b);
      f.onsubmit=async ev=>{
        ev.preventDefault();
        if(!n.value.trim()||!t.value.trim()){(n.value.trim()?t:n).focus();return}
        b.disabled=true;
        try{
          await db.collection("comments").add({postId:p.id,name:n.value.trim().slice(0,10),text:t.value.trim().slice(0,120),author:me,createdAt:Date.now()});
          try{localStorage.setItem("pl-cname",n.value.trim())}catch(_){}
        }catch(e){toast(e&&e.code==="not_granted"?"댓글을 쓸 권한이 없어요. 공유한 사람에게 참여 권한을 요청해 주세요.":"댓글을 등록하지 못했어요. 잠시 후 다시 시도해 주세요.");b.disabled=false}
      };
      box.append(f);li.append(box);
    }
    ul.append(li);
  }
}
$("post").addEventListener("click",async()=>{
  if(!db){toast("게시판은 로그인한 상태에서만 쓸 수 있어요.");return}
  const id="p"+h(cur.key,131).toString(36);
  $("post").disabled=true;
  try{
    await db.doc("posts/"+id).set({name:cur.name,life:cur.life,glyph:cur.glyph,tier:cur.tier,mistake:cur.mistake,author:me,createdAt:Date.now()});
    toast("게시판에 올렸어요. 아래에서 확인해 보세요.");
  }catch(e){toast(e&&e.code==="not_granted"?"올릴 권한이 없어요. 공유한 사람에게 참여 권한을 요청해 주세요.":"올리지 못했어요. 잠시 후 다시 시도해 주세요.")}
  $("post").disabled=false;
});
function hideBoard(){$("board").hidden=true;$("post").hidden=true;$("save").classList.add("wide")}

(async function init(){
  let n="오스카",b="1988-07-14";
  try{const s=JSON.parse(localStorage.getItem("pl-last")||"null");if(s&&s.name&&s.birth){n=s.name;b=s.birth;$("name").value=n;$("birth").value=b}}catch(_){}
  await show(n,b,false);
  if(KAKAO_JS_KEY)loadKakao(); // 공유 버튼을 누를 때 바로 열리도록 SDK 미리 불러옴
  if(!window.claude){hideBoard();return}
  db=await claude.use("db");
  const user=await claude.use("user");
  if(user){try{me=await user.id()}catch(_){}}
  if(!db){renderFeed();return}
  db.collection("posts").orderBy("createdAt","desc").limit(50).onSnapshot(s=>{
    posts=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed();
  },()=>{renderFeed()});
  db.collection("comments").orderBy("createdAt","asc").limit(500).onSnapshot(s=>{
    cmts={};for(const d of s.docs){const c=d.data();(cmts[c.postId]=cmts[c.postId]||[]).push(c)}renderFeed();
  },()=>{});
})();
</script>
</body>
